<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>たのしい ピアノあそび</title>
  <style>
    /* ==========================================
       1. 基本スタイル & iPhone描画補正
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; /* タップ時の四角い外枠を消去 */
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background-color: #fef4ea;
      color: #444;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      border-radius: 20px;
    }

    /* 画面切り替えクラス */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 15px 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
      z-index: 1;
    }

    .screen.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 10;
    }

    /* タイトルヘッダー */
    .title-header {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff6b81;
      text-align: center;
      background: #fff0f3;
      padding: 8px 20px;
      border-radius: 30px;
      border: 3px solid #ffb3c1;
      box-shadow: 0 4px 10px rgba(255, 107, 129, 0.2);
      margin-top: 10px;
    }

    /* ==========================================
       2. スタート画面
       ========================================== */
    #start-screen {
      justify-content: center;
      gap: 30px;
      background: linear-gradient(135deg, #fff9e6 0%, #ffedf0 100%);
    }

    .start-logo {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ff4757;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffa502;
      text-align: center;
      line-height: 1.3;
    }

    /* 四角い外枠を出さない綺麗なスタートボタン */
    .start-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff6b81, #ff4757);
      color: white;
      font-size: 2rem;
      font-weight: bold;
      border: 6px solid #ffffff;
      box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
      cursor: pointer;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s ease;
      -webkit-appearance: none;
    }

    .start-btn:active {
      transform: scale(0.92);
    }

    /* ==========================================
       3. メイン表示エリア（お皿・お団子）
       ========================================== */
    .stage-display {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* iPhoneのお皿切れ防止 */
    .plate-wrapper {
      width: 90%;
      max-width: 340px;
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .plate-img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* アスペクト比を維持して収める */
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
    }

    /* さくらんぼ配置 */
    .cherries-container {
      position: absolute;
      top: 25%;
      width: 80%;
      height: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .cherry-item {
      width: 65px;
      height: 65px;
      object-fit: contain;
      transform: scale(0);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cherry-item.visible {
      transform: scale(1);
    }

    /* iPhone用お団子サイズ調整 (265px指定) */
    .dango-wrapper {
      width: 100%;
      max-width: 265px;
      height: 260px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 0 auto;
    }

    .dango-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }

    .dango-skewer {
      position: absolute;
      bottom: 10px;
      width: 12px;
      height: 220px;
      background: #d7ccc8;
      border-radius: 6px;
      border: 2px solid #8d6e63;
      z-index: 1;
    }

    .dango-item {
      width: 85px;
      height: 65px;
      z-index: 2;
      margin-bottom: -10px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s ease-out;
    }

    .dango-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================
       4. くす玉 & ピカピカ点滅リトライボタン
       ========================================== */
    #kusudama-screen {
      justify-content: space-around;
      background: radial-gradient(circle, #ffffff 0%, #fff3e0 100%);
    }

    .kusudama-box {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .kusudama-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-15px); }
    }

    /* 真ん中の赤いピカピカ点滅ボタン */
    .red-retry-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d4d, #cc0000);
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: bold;
      border: 5px solid #ffffff;
      outline: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
      animation: blinkRed 0.6s ease-in-out infinite alternate;
      -webkit-appearance: none;
    }

    @keyframes blinkRed {
      0% {
        transform: scale(1);
        box-shadow: 0 0 10px #ff4d4d, 0 0 20px #ff0000;
        filter: brightness(1);
      }
      100% {
        transform: scale(1.15);
        box-shadow: 0 0 30px #ff0000, 0 0 50px #ff0000;
        filter: brightness(1.4);
      }
    }

    .red-retry-btn:active {
      transform: scale(0.95);
    }

    /* ==========================================
       5. ピアノ鍵盤エリア
       ========================================== */
    .keyboard-container {
      width: 100%;
      height: 160px;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      background: #222;
      padding: 8px 4px 12px;
      border-top: 6px solid #ff6b81;
      border-radius: 15px 15px 0 0;
      gap: 3px;
    }

    .key {
      flex: 1;
      height: 100%;
      background: #ffffff;
      border-radius: 0 0 8px 8px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #333;
      box-shadow: inset 0 -8px 0 #e0e0e0, 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      outline: none;
      transition: background 0.05s, transform 0.05s;
    }

    .key:active, .key.pressed {
      background: #ffeaa7;
      box-shadow: inset 0 -2px 0 #e0e0e0, 0 2px 3px rgba(0,0,0,0.3);
      transform: translateY(4px);
    }

    .key.c { color: #e74c3c; }
    .key.d { color: #e67e22; }
    .key.e { color: #f1c40f; }
    .key.f { color: #2ecc71; }
    .key.g { color: #1abc9c; }
    .key.a { color: #3498db; }
    .key.b { color: #9b59b6; }
    .key.c2 { color: #e84393; }

    /* 鍵盤無効化フラグ */
    .keyboard-container.disabled {
      pointer-events: none;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div id="app-container">

    <!-- 1. スタート画面 -->
    <div id="start-screen" class="screen active">
      <div class="start-logo">たのしい<br>ピアノあそび</div>
      <button id="start-btn" class="start-btn">スタート</button>

              <path d="M50,20 Q40,5 25,35" stroke="#4caf50" stroke-width="4" fill="none" stroke-linecap="round"/>
              <circle cx="25" cy="42" r="16" fill="#ff2a4b"/>

              <path d="M50,20 Q40,5 25,35" stroke="#4caf50" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 3. お団子画面 -->
    <div id="dango-screen" class="screen">

    <!-- 4. くす玉画面 -->

      <div class="kusudama-box">

          <rect x="160" y="110" width="12" height="8" fill="#1e90ff" transform="rotate(-20 160 110)"/>
          <polygon points="50,150 58,165 42,165" fill="#e84393"/>
          <polygon points="140,140 152,150 135,158" fill="#fecb6e"/>
          <!-- くす玉割れた本体 -->
          <path d="M 50 90 A 50 50 0 0 1 150 90 Z" fill="#ff6b81" stroke="#ff4757" stroke-width="3"/>
          <path d="M 50 95 A 50 50 0 0 0 150 95 Z" fill="#ffa502" stroke="#ff7f50" stroke-width="3"/>
          <text x="100" y="85" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">おめでとう</text>

      <!-- 真ん中の赤いピカピカ点滅ボタン -->

      <div></div>

  <script>
    /* ==========================================
       Web Audio API 完全対応サウンドエンジン
       ========================================== */
    class BulletproofAudioEngine {
      constructor() {
        this.ctx = null;
        this.buffers = new Map();
        this.activeSources = new Set();
        this.soundUrls = {
          'c': 'do.mp3',
          'd': 're.mp3',
          'e': 'mi.mp3',
          'f': 'fa.mp3',
          'g': 'so.mp3',
          'a': 'la.mp3',
          'b': 'si.mp3',
          'c2': 'do2.mp3',
          'success2': 'success2.mp3',
          'clear1': 'clear1.mp3',
          'clear2': 'clear2.mp3',
          'retry': 'retry.mp3'
        };
        // 周波数（MP3ファイル読み込み失敗時のバックアップ用音源生成）
        this.freqs = {
          'c': 261.63, 'd': 293.66, 'e': 329.63, 'f': 349.23,
          'g': 392.00, 'a': 440.00, 'b': 493.88, 'c2': 523.25,
          'success2': 880.00, 'clear1': 587.33, 'clear2': 659.25, 'retry': 698.46
        };
      }

      // AudioContextの初期化
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }

      // モバイル自動再生制限解除
      async unlock() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') {
          await this.ctx.resume();
        }
      }

      // サウンド全ロード
      async loadAllSounds() {
        this.init();
        const promises = Object.keys(this.soundUrls).map(async (key) => {
          const url = this.soundUrls[key];
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP error ${response.status}`);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
            this.buffers.set(key, audioBuffer);
          } catch (e) {
            // ファイルが存在しない・ロード不可時の合成フォールバック音を作成（絶対動作保証）
            const fallbackBuffer = this.createSyntheticBuffer(this.freqs[key] || 440, key.includes('clear') ? 2.0 : 0.6);
            this.buffers.set(key, fallbackBuffer);
          }
        });
        await Promise.all(promises);
      }

      // 合成音生成（絶対に音が消えない保険）
      createSyntheticBuffer(freq, duration) {
        if (!this.ctx) return null;
        const sampleRate = this.ctx.sampleRate;
        const buffer = this.ctx.createBuffer(1, sampleRate * duration, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < buffer.length; i++) {
          const t = i / sampleRate;
          data[i] = Math.sin(2 * Math.PI * freq * t) * Math.exp(-t * (3.0 / duration));
        }
        return buffer;
      }

      // すべての再生中音声を即座に全クリア（スタート時などのボイス重複を100%防止）
      stopAll() {
        this.activeSources.forEach(source => {
          try {
            source.onended = null;
            source.stop();
          } catch (e) {}
        });
        this.activeSources.clear();
      }

      // 音声の確実再生 (onendedコールバック対応)
      play(key, onendedCallback = null) {
        this.unlock();
        if (!this.ctx) return;

        const buffer = this.buffers.get(key);
        if (!buffer) {
          if (onendedCallback) onendedCallback();
          return;
        }

        // ノード作成 (Web Audio API)
        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(this.ctx.destination);

        this.activeSources.add(source);

        source.onended = () => {
          this.activeSources.delete(source);
          if (onendedCallback && typeof onendedCallback === 'function') {
            onendedCallback();
          }
        };

        source.start(0);
      }
    }

    /* ==========================================
       ゲーム進行ロジック
       ========================================== */
    const audio = new BulletproofAudioEngine();

    // 状態変数
    let currentStage = 'start'; // start, cherry, dango, kusudama
    let cherryCount = 0;
    let dangoCount = 0;
    let isProcessingStageClear = false;

    // DOM要素
    const screens = {
      start: document.getElementById('start-screen'),
      cherry: document.getElementById('cherry-screen'),
      dango: document.getElementById('dango-screen'),
      kusudama: document.getElementById('kusudama-screen')
    };

    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const keyboardCherry = document.getElementById('keyboard-cherry');
    const keyboardDango = document.getElementById('keyboard-dango');

    // 初期ロード
    window.addEventListener('DOMContentLoaded', () => {
      audio.loadAllSounds();
    });

    // 画面切り替え関数
    function showScreen(screenKey) {
      Object.keys(screens).forEach(key => {
        if (key === screenKey) {
          screens[key].classList.add('active');
        } else {
          screens[key].classList.remove('active');
        }
      });
      currentStage = screenKey;
    }

    // ゲーム開始 (スタートボタン)
    startBtn.addEventListener('click', async () => {
      await audio.unlock();
      audio.stopAll(); // 前のボイス・効果音を完全リセット

      // カウント初期化
      cherryCount = 0;
      dangoCount = 0;
      isProcessingStageClear = false;

      // リセット表示
      for (let i = 1; i <= 3; i++) {
        document.getElementById(`cherry-${i}`).classList.remove('visible');
        document.getElementById(`dango-${i}`).classList.remove('visible');
      }
      keyboardCherry.classList.remove('disabled');
      keyboardDango.classList.remove('disabled');

      showScreen('cherry');
    });

    // 鍵盤タップ時の共通処理
    function handleKeyPress(noteKey) {
      if (isProcessingStageClear) return; // 判定中は連打防止

      audio.unlock();

      if (currentStage === 'cherry') {
        if (cherryCount < 3) {
          cherryCount++;
          // 鍵盤音再生
          audio.play(noteKey);
          
          // さくらんぼ表示
          document.getElementById(`cherry-${cherryCount}`).classList.add('visible');

          if (cherryCount < 3) {
            // 1, 2個目：success2.mp3 を再生
            setTimeout(() => {
              audio.play('success2');
            }, 150);
          } else {
            // 仕様2: さくらんぼ3つ目の時
            // お皿に3つ乗った画面のままで即座に clear1.mp3 を最後まで聴かせ、終わった瞬間(onended)にお団子画面へ進む
            isProcessingStageClear = true;
            keyboardCherry.classList.add('disabled');

            setTimeout(() => {
              audio.play('clear1', () => {
                // clear1.mp3 が最後まで完全に終わった瞬間
                showScreen('dango');
                isProcessingStageClear = false;
              });
            }, 200);
          }
        }
      } else if (currentStage === 'dango') {
        if (dangoCount < 3) {
          dangoCount++;
          // 鍵盤音再生
          audio.play(noteKey);

          // お団子表示
          document.getElementById(`dango-${dangoCount}`).classList.add('visible');

          if (dangoCount < 3) {
            // 1, 2個目：success2.mp3 を再生
            setTimeout(() => {
              audio.play('success2');
            }, 150);
          } else {
            // 仕様3: お団子3つ目の時
            // ゲーム画面のままで clear2.mp3 を最後まで聴かせ、終わった瞬間にくす玉画面へ進めて retry.mp3 を流す
            isProcessingStageClear = true;
            keyboardDango.classList.add('disabled');

            setTimeout(() => {
              audio.play('clear2', () => {
                // clear2.mp3 が最後まで完全に終わった瞬間
                showScreen('kusudama');
                // retry.mp3 を流す
                audio.play('retry');
                isProcessingStageClear = false;
              });
            }, 200);
          }
        }
      }
    }

    // 鍵盤イベントバインド (タッチ・クリックの重複防止)
    const setupKeyboard = (keyboardEl) => {
      const keys = keyboardEl.querySelectorAll('.key');
      keys.forEach(key => {
        const handleEvent = (e) => {
          e.preventDefault();
          const note = key.getAttribute('data-note');
          key.classList.add('pressed');
          setTimeout(() => key.classList.remove('pressed'), 150);
          handleKeyPress(note);
        };

        key.addEventListener('touchstart', handleEvent, { passive: false });
        key.addEventListener('click', (e) => {
          if (e.detail !== 0) return; // タッチイベントとの重複実行をガード
          handleEvent(e);
        });
      });
    };

    setupKeyboard(keyboardCherry);
    setupKeyboard(keyboardDango);

    // もうかい (リトライ) ボタン
    retryBtn.addEventListener('click', async () => {
      await audio.unlock();
      audio.stopAll();

      // 初期化してさくらんぼ画面に戻る
      cherryCount = 0;
      dangoCount = 0;
      isProcessingStageClear = false;

      for (let i = 1; i <= 3; i++) {
        document.getElementById(`cherry-${i}`).classList.remove('visible');
        document.getElementById(`dango-${i}`).classList.remove('visible');
      }
      keyboardCherry.classList.remove('disabled');
      keyboardDango.classList.remove('disabled');

      showScreen('cherry');
    });
  </script>
</body>
</html>
