<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>たのしい ピアノあそび</title>
  <style>
    /* =========================================================
       1. 基本スタイル & 全体設定
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
      color: #334155;
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    .screen.active {
      display: flex;
    }

    /* 右上固定のリセットボタン（↻） */
    #btn-reset {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 34px;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.22);
      cursor: pointer;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease;
    }

    #btn-reset:active {
      transform: scale(0.88);
    }

    /* ピカピカ点滅（発光）アニメーション */
    #btn-reset.pika-pika {
      animation: pikaPikaGlow 1.2s infinite ease-in-out;
      border-color: #fffbeb;
    }

    @keyframes pikaPikaGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 12px #ef4444, 0 0 25px #f59e0b, 0 0 35px #fef08a;
        background: #ef4444;
      }
      50% {
        transform: scale(1.18);
        box-shadow: 0 0 30px #f43f5e, 0 0 50px #fbbf24, 0 0 70px #ffffff;
        background: #f43f5e;
      }
    }

    /* =========================================================
       2. スタート画面（トントン画面）
       ========================================================= */
    #screen-start {
      background: linear-gradient(135deg, #ffedd5 0%, #fef08a 100%);
      cursor: pointer;
      text-align: center;
    }

    .start-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 3.2rem 2.8rem;
      border-radius: 44px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.12);
      border: 5px solid #fbbf24;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2rem;
      max-width: 90%;
      width: auto;
    }

    .start-title {
      font-size: clamp(2rem, 6.5vw, 3.2rem);
      color: #d97706;
      font-weight: bold;
      text-shadow: 1px 1px 0px white;
      white-space: nowrap;
    }

    .btn-tonton {
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      padding: 1.1rem 3.8rem;
      border-radius: 50px;
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 100%);
      color: white;
      font-weight: bold;
      border: none;
      box-shadow: 0 8px 25px rgba(225, 29, 72, 0.4);
      animation: pulse 1.8s infinite;
      cursor: pointer;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* =========================================================
       3. メインゲーム画面（iPad横画面：余白ゼロ＆超ドカン特大）
       ========================================================= */
    #screen-game {
      display: none;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem; /* 余白を極限までカット */
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }

    #screen-game.active {
      display: flex;
    }

    /* --- 左エリア：ドラッグ元 --- */
    .game-sidebar-left {
      width: 28%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* ドラッグ枠（iPad特大サイズ用：380px） */
    .source-box {
      width: 380px;
      height: 380px;
      background: rgba(255, 255, 255, 0.82);
      border: 5px dashed #38bdf8;
      border-radius: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* ★ ドラッグ要素（iPad横画面：超ドカン特大サイズ）
       ステージ1（さくらんぼ）: 290px（前回の倍近く！）
       ステージ2（お団子）    : 380px（黒鍵3本を完全に包み込む！）
    */
    #draggable {
      width: 290px;
      height: 290px;
      cursor: grab;
      touch-action: none;
      position: absolute;
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #draggable.stage2-size {
      width: 380px;
      height: 380px;
    }

    #draggable:active {
      cursor: grabbing;
    }

    /* 位置移動（translate）のみアニメーション（回転ブレを排除） */
    #draggable.snap-back {
      transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #image-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ★ 回転ブレ徹底撲滅：画像要素のtransitionを絶対遮断 */
    #item-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.25));
      transition: none !important; /* 途中のくるっとした回転を完全無効化 */
    }

    .emoji-fallback {
      font-size: 130px;
      line-height: 1;
      display: none;
    }

    /* ★ お団子の回転制御（iPad横画面では最初から最後まで真横「三」に完全固定） */
    .is-dango {
      transform: rotate(90deg) !important;
      transition: none !important;
    }

    .tray-item-dango {
      transform: rotate(90deg) !important;
      transition: none !important;
    }

    /* --- 中央エリア：鍵盤（iPad横画面で画面いっぱい限界突破拡大） --- */
    .game-center {
      width: 48%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #keyboard-wrapper {
      position: relative;
      width: 100%;
      max-width: 98vw; /* 制限解除 */
      height: 520px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 10px;
    }

    .piano-keyboard {
      display: flex;
      position: relative;
      background: #1e293b;
      padding: 14px;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.28);
    }

    #keyboard-wrapper.has-custom-bg .piano-keyboard {
      opacity: 0;
    }

    /* 鍵盤の超特大化 */
    .white-key {
      width: 130px;
      height: 420px;
      background: white;
      border: 4px solid #cbd5e1;
      border-radius: 0 0 18px 18px;
      margin: 0 5px;
    }

    .black-keys-target {
      position: absolute;
      top: 14px;
      display: flex;
      gap: 22px;
      padding: 0;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      z-index: 20;
    }

    .stage1-target {
      left: 155px;
      width: 190px;
      height: 250px;
    }

    .stage2-target {
      left: 280px;
      width: 320px;
      height: 250px;
    }

    .black-key {
      width: 82px;
      height: 250px;
      background: #0f172a;
      border-radius: 0 0 12px 12px;
    }

    #keyboard-wrapper.has-custom-bg .black-key {
      opacity: 0;
    }

    /* 背景画像適用時の精密ヒットエリア配置 */
    #keyboard-wrapper.has-custom-bg .stage1-target {
      top: 10%;
      left: 36%;
      width: 28%;
      height: 50%;
    }

    #keyboard-wrapper.has-custom-bg .stage2-target {
      top: 10%;
      left: 30%;
      width: 40%;
      height: 50%;
    }

    /* --- 右エリア：ごほうびトレイ（お皿） --- */
    .game-sidebar-right {
      width: 24%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .tray-container {
      width: 220px;
      height: 440px;
      background: rgba(255, 255, 255, 0.94);
      border: 5px solid #f59e0b;
      border-radius: 44px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .tray-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #d97706;
      margin-bottom: 6px;
    }

    #tray-area {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column; /* iPad横画面：縦に並べて「三」の配置 */
      justify-content: space-around;
      align-items: center;
    }

    .tray-item {
      width: 110px;
      height: 110px;
      object-fit: contain;
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* =========================================================
       4. 全クリア・ごほうび画面（くす玉）
       ========================================================= */
    #screen-reward {
      background: linear-gradient(135deg, #fef08a 0%, #f472b6 100%);
      text-align: center;
      z-index: 30;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 31;
    }

    .reward-content {
      position: relative;
      z-index: 32;
      background: rgba(255, 255, 255, 0.95);
      padding: 3rem 4rem;
      border-radius: 48px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 90%;
    }

    .reward-title {
      font-size: clamp(2rem, 6.5vw, 3.2rem);
      color: #e11d48;
      font-weight: bold;
      white-space: nowrap;
    }

    .reward-emoji {
      font-size: 6.5rem;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }

    .btn-replay {
      font-size: clamp(1.4rem, 4.8vw, 2rem);
      padding: 1rem 3.5rem;
      border-radius: 45px;
      background: #10b981;
      color: white;
      font-weight: bold;
      border: none;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
      cursor: pointer;
      white-space: nowrap;
    }

    /* =========================================================
       5. iPhone（縦画面）最適化スタイル
       ========================================================= */
    @media (orientation: portrait) {
      #screen-game {
        flex-direction: column;
        justify-content: space-around;
        padding: 1rem;
      }

      .game-sidebar-left, .game-center, .game-sidebar-right {
        width: 100%;
        height: auto;
      }

      .source-box {
        width: 220px;
        height: 220px;
      }

      /* iPhone（縦画面）：さくらんぼ＝完璧な120px、お団子＝もう一息大きく【240px】 */
      #draggable {
        width: 120px;
        height: 120px;
      }

      #draggable.stage2-size {
        width: 240px;
        height: 240px;
      }

      #keyboard-wrapper {
        max-width: 100%;
        height: 310px;
      }

      .white-key {
        width: 72px;
        height: 220px;
      }

      .black-key {
        width: 46px;
        height: 130px;
      }

      .stage1-target {
        left: 86px;
        width: 108px;
        height: 130px;
      }

      .stage2-target {
        left: 156px;
        width: 175px;
        height: 130px;
      }

      .tray-container {
        width: 330px;
        height: 130px;
        flex-direction: column;
      }

      #tray-area {
        flex-direction: row; /* iPhone（縦画面）時：横並び */
      }

      /* iPhone（縦画面）のお皿の上でのみ縦向き「川」に補正 */
      .tray-item-dango {
        transform: rotate(0deg) !important;
      }
    }
  </style>
</head>
<body>

  <!-- 右上固定コントロール：最初に戻るボタン（↻） -->
  <button id="btn-reset" title="最初に戻る">↻</button>

  <!-- 1. トントン画面（スタート） -->
  <section id="screen-start" class="screen active">
    <div class="start-card">
      <div class="start-title">たのしい ピアノあそび</div>
      <button id="btn-tonton" class="btn-tonton">トントン！</button>
    </div>
  </section>

  <!-- 2. メインゲーム画面 -->
  <section id="screen-game" class="screen">
    <!-- 左：ドラッグ元 -->
    <div class="game-sidebar-left">
      <div class="source-box">
        <div id="draggable">
          <div id="image-container">
            <img id="item-img" src="" alt="アイテム">
          </div>
          <div id="emoji-fallback" class="emoji-fallback">🍒</div>
        </div>
      </div>
    </div>

    <!-- 中央：鍵盤 -->
    <div class="game-center">
      <div id="keyboard-wrapper">
        <!-- JSで鍵盤・判定枠を生成 -->
      </div>
    </div>

    <!-- 右：ごほうびトレイ（お皿） -->
    <div class="game-sidebar-right">
      <div class="tray-container">
        <div class="tray-title">できたよ！</div>
        <div id="tray-area"></div>
      </div>
    </div>
  </section>

  <!-- 3. くす玉・全クリア画面 -->
  <section id="screen-reward" class="screen">
    <canvas id="confetti-canvas"></canvas>
    <div class="reward-content">
      <div class="reward-emoji">🎊</div>
      <div class="reward-title">ぜんぶ クリア！</div>
      <button id="btn-replay" class="btn-replay">もう一度あそぶ</button>
    </div>
  </section>

  <!-- =========================================================
     JavaScript（完全再生＆1.4秒余韻タイマー＆回転ブレ徹底排除）
     ========================================================= -->
  <script>
    /* 1. 画像探査リスト */
    const FILES_STAGE1_BG = ["kenban1.png", "Kenban1.png", "kenban1.PNG", "Kenban1.PNG", "KENBAN1.PNG", "kenban1.jpg"];
    const FILES_STAGE2_BG = ["kenban2.png", "Kenban2.png", "kenban2.PNG", "Kenban2.PNG", "KENBAN2.PNG", "kenban2.jpg"];
    const FILES_SAKURANBO = ["sakuranbo.png", "Sakuranbo.png", "sakuranbo.PNG", "Sakuranbo.PNG", "SAKURANBO.PNG", "sakuranbo.jpg"];
    const FILES_KUSHIDANGO = ["kushidango.png", "Kushidango.png", "kushidango.PNG", "Kushidango.PNG", "KUSHIDANGO.PNG", "kushidango.jpg"];

    /* 2. ゲーム状態変数 */
    let currentStage = 1;  
    let successCount = 0;  
    let isLocked = false;  

    let loadedPathSakuranbo = "";
    let loadedPathKushidango = "";

    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;

    /* DOM要素 */
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenReward = document.getElementById('screen-reward');

    const btnTonton = document.getElementById('btn-tonton');
    const btnReset = document.getElementById('btn-reset');
    const btnReplay = document.getElementById('btn-replay');

    const draggable = document.getElementById('draggable');
    const itemImg = document.getElementById('item-img');
    const emojiFallback = document.getElementById('emoji-fallback');
    const keyboardWrapper = document.getElementById('keyboard-wrapper');
    const trayArea = document.getElementById('tray-area');

    /* 3. 音声再生エンジン（クリア音声完了の絶対保証＆タイムアウト安全策） */
    const audioPlayer = new Audio();

    function unlockAudioIOS() {
      audioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
      audioPlayer.play().catch(() => {});
    }

    function playMp3(filename, onEndedCallback) {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.src = filename;

      let hasExecuted = false;
      let safeTimeoutId = null;

      const finishHandler = () => {
        if (!hasExecuted) {
          hasExecuted = true;
          if (safeTimeoutId) clearTimeout(safeTimeoutId);
          audioPlayer.onended = null;
          audioPlayer.onerror = null;
          if (onEndedCallback) onEndedCallback();
        }
      };

      if (onEndedCallback) {
        audioPlayer.onended = finishHandler;
        audioPlayer.onerror = finishHandler;
        /* 安全策：万が一ブラウザがonendedイベントを出さなくても6秒後に進む */
        safeTimeoutId = setTimeout(finishHandler, 6000);
      } else {
        audioPlayer.onended = null;
        audioPlayer.onerror = null;
      }

      audioPlayer.play().catch(err => {
        console.log("Audio play failed or blocked: " + filename, err);
        finishHandler();
      });
    }

    /* 4. 画面切り替え */
    function showScreen(targetScreen) {
      [screenStart, screenGame, screenReward].forEach(s => s.classList.remove('active'));
      targetScreen.classList.add('active');

      if (targetScreen !== screenReward) {
        btnReset.classList.remove('pika-pika');
      }
    }

    /* 5. 画像自動探査読み込み */
    function loadImageWithFallback(imgElement, candidates, fallbackEmoji, onSuccessCallback) {
      let index = 0;
      imgElement.style.display = 'block';
      if (emojiFallback) emojiFallback.style.display = 'none';

      imgElement.onerror = function() {
        index++;
        if (index < candidates.length) {
          imgElement.src = candidates[index];
        } else {
          imgElement.style.display = 'none';
          if (emojiFallback) {
            emojiFallback.style.display = 'block';
            emojiFallback.textContent = fallbackEmoji;
          }
        }
      };

      imgElement.onload = function() {
        if (onSuccessCallback) onSuccessCallback(imgElement.src);
      };

      imgElement.src = candidates[0];
    }

    function setKeyboardBackgroundWithFallback(candidates) {
      let index = 0;
      keyboardWrapper.classList.remove('has-custom-bg');

      function tryNext() {
        if (index >= candidates.length) {
          keyboardWrapper.style.backgroundImage = 'none';
          return;
        }
        const img = new Image();
        const testUrl = candidates[index];

        img.onload = function() {
          keyboardWrapper.style.backgroundImage = `url('${testUrl}')`;
          keyboardWrapper.classList.add('has-custom-bg');
        };

        img.onerror = function() {
          index++;
          tryNext();
        };

        img.src = testUrl;
      }

      tryNext();
    }

    /* 6. ステージ構築 */
    function startStage(stageNum) {
      currentStage = stageNum;
      successCount = 0;
      isLocked = false; 
      trayArea.innerHTML = '';
      resetDraggablePosition();

      if (stageNum === 1) {
        // ステージ1：さくらんぼ
        draggable.classList.remove('stage2-size');
        itemImg.classList.remove('is-dango');

        setKeyboardBackgroundWithFallback(FILES_STAGE1_BG);
        loadImageWithFallback(itemImg, FILES_SAKURANBO, "🍒", path => {
          loadedPathSakuranbo = path;
        });

        keyboardWrapper.innerHTML = `
          <div class="piano-keyboard">
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="black-keys-target stage1-target" id="target-area">
              <div class="black-key"></div>
              <div class="black-key"></div>
            </div>
          </div>
        `;

        showScreen(screenGame);
        playMp3("start1.mp3");

      } else if (stageNum === 2) {
        // ステージ2：お団子（超ドカン特大 & 回転ブレ排除）
        draggable.classList.add('stage2-size');
        itemImg.classList.add('is-dango');

        setKeyboardBackgroundWithFallback(FILES_STAGE2_BG);
        loadImageWithFallback(itemImg, FILES_KUSHIDANGO, "🍡", path => {
          loadedPathKushidango = path;
        });

        keyboardWrapper.innerHTML = `
          <div class="piano-keyboard">
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="black-keys-target stage2-target" id="target-area">
              <div class="black-key"></div>
              <div class="black-key"></div>
              <div class="black-key"></div>
            </div>
          </div>
        `;

        showScreen(screenGame);
        playMp3("start2.mp3");
      }
    }

    /* お皿にごほうび追加 */
    function addItemToTray() {
      const trayImg = document.createElement('img');

      if (currentStage === 1) {
        trayImg.className = 'tray-item';
        trayImg.src = loadedPathSakuranbo || itemImg.src;
      } else {
        trayImg.className = 'tray-item tray-item-dango';
        trayImg.src = loadedPathKushidango || itemImg.src;
      }

      trayArea.appendChild(trayImg);
    }

    /* 7. ドラッグ＆ドロップ ＆ 判定ロジック */
    function getEventPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function handleDragStart(e) {
      unlockAudioIOS();
      if (isDragging || isLocked) return; // ★操作ロック中は一切反応しない
      isDragging = true;

      draggable.classList.remove('snap-back');

      const pos = getEventPos(e);
      startX = pos.x - currentX;
      startY = pos.y - currentY;

      if (e.cancelable) e.preventDefault();
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();

      const pos = getEventPos(e);
      currentX = pos.x - startX;
      currentY = pos.y - startY;

      draggable.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px)`;
    }

    function handleDragEnd() {
      if (!isDragging) return;
      isDragging = false;

      const targetArea = document.getElementById('target-area');
      if (!targetArea) return;

      const itemRect = draggable.getBoundingClientRect();
      const targetRect = targetArea.getBoundingClientRect();

      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;

      /* 黒鍵の真上・厳格ミリ単位判定 */
      const MARGIN_X = 22;
      const MARGIN_Y_TOP = 12;
      const MARGIN_Y_BOTTOM = -10;

      const isHit =
        itemCenterX >= (targetRect.left - MARGIN_X) &&
        itemCenterX <= (targetRect.right + MARGIN_X) &&
        itemCenterY >= (targetRect.top - MARGIN_Y_TOP) &&
        itemCenterY <= (targetRect.bottom + MARGIN_Y_BOTTOM);

      if (isHit) {
        // 正解！
        successCount++;
        addItemToTray();
        resetDraggablePosition();

        if (successCount === 1) {
          playMp3("success1.mp3");
        } else if (successCount === 2) {
          playMp3("success2.mp3");
        } else if (successCount >= 3) {
          /* ★ 3つ成功した瞬間に操作を完全ガード */
          isLocked = true;

          /* ★【じっくり見せる余韻タイマー】
             お皿に3つ目が並んだ瞬間を1.4秒間子どもたちに見せてからクリア処理を進める
          */
          setTimeout(() => {
            if (currentStage === 1) {
              /* 1.4秒後、「clear1.mp3」を確実に再生し、最後まで聴き終わってからステージ2へ */
              playMp3("clear1.mp3", () => {
                setTimeout(() => {
                  startStage(2);
                }, 200);
              });
            } else if (currentStage === 2) {
              /* 1.4秒後、「clear2.mp3」を再生して画面切り替え＆「retry.mp3」へ */
              playMp3("clear2.mp3", () => {
                playMp3("retry.mp3");
              });
              showRewardScreen();
            }
          }, 1400); // 1.4秒の達成感ウェイト
        }

      } else {
        // 不正解：スムーズに位置復帰
        draggable.classList.add('snap-back');
        currentX = 0;
        currentY = 0;
        draggable.style.transform = 'translate3d(0px, 0px, 0px)';
      }
    }

    function resetDraggablePosition() {
      draggable.classList.remove('snap-back');
      currentX = 0;
      currentY = 0;
      draggable.style.transform = 'translate3d(0px, 0px, 0px)';
    }

    /* イベント登録 */
    draggable.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd, { passive: false });

    draggable.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);

    /* 8. くす玉・紙吹雪演出 ＆ ピカピカボタン処理 */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId = null;

    function showRewardScreen() {
      showScreen(screenReward);
      btnReset.classList.add('pika-pika'); // 右上リセットボタンをピカピカ点滅（発光）！
      startConfetti();
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function startConfetti() {
      resizeCanvas();
      particles = [];
      const colors = ['#f43f5e', '#0ea5e9', '#eab308', '#22c55e', '#a855f7', '#ec4899'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 14 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vy: Math.random() * 3 + 2,
          vx: Math.random() * 2 - 1,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 4 - 2
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        p.y += p.vy;
        p.x += p.vx;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      animationId = requestAnimationFrame(renderConfetti);
    }

    function stopConfetti() {
      if (animationId) cancelAnimationFrame(animationId);
    }

    /* 9. リセット＆再プレイ */
    btnTonton.addEventListener('click', () => {
      unlockAudioIOS();
      startStage(1);
    });

    screenStart.addEventListener('click', (e) => {
      if (e.target === screenStart) {
        unlockAudioIOS();
        startStage(1);
      }
    });

    btnReset.addEventListener('click', () => {
      isLocked = false;
      audioPlayer.pause();
      stopConfetti();
      showScreen(screenStart);
    });

    btnReplay.addEventListener('click', () => {
      isLocked = false;
      audioPlayer.pause();
      stopConfetti();
      showScreen(screenStart);
    });
  </script>
</body>
