<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ピアノ知育ミニゲーム</title>
  <style>
    /* =========================================================
       基本スタイル & レスポンシブ設定
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f9ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    /* ゲーム全体のメインコンテナ */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    /* =========================================================
       進捗表示（★マーク）
       ========================================================= */
    .progress-bar {
      position: absolute;
      top: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    .star {
      width: 45px;
      height: 45px;
      background: #e2e8f0;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      transition: background 0.4s ease, transform 0.4s ease;
    }

    .star.active {
      background: #facc15;
      transform: scale(1.2);
    }

    /* =========================================================
       鍵盤表示エリア（黒鍵2本 / 3本）
       ========================================================= */
    .keyboard-area {
      position: absolute;
      top: 15%;
      width: 90vw;
      max-width: 600px;
      height: 40vh;
      max-height: 320px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    /* CSSによる鍵盤の描画（画像がない場合のフォールバック兼判定枠） */
    .piano-keys {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 4px solid #333;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    /* 白鍵 */
    .white-key {
      flex: 1;
      height: 100%;
      border-right: 2px solid #cbd5e1;
      background: linear-gradient(to bottom, #ffffff 0%, #f1f5f9 100%);
      border-radius: 0 0 8px 8px;
    }
    .white-key:last-child {
      border-right: none;
    }

    /* 黒鍵のターゲットエリア（正解判定枠） */
    .target-black-keys {
      position: absolute;
      top: 0;
      display: flex;
      justify-content: space-around;
      height: 60%;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 0 0 12px 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      transition: outline 0.3s ease;
    }

    /* ステージ1（ドレミ）：白鍵3本、黒鍵2本エリア */
    .stage-1-keys { width: 80%; }
    .stage-1-target {
      left: 16.66%;
      width: 66.66%;
    }

    /* ステージ2（ファソラシ）：白鍵4本、黒鍵3本エリア */
    .stage-2-keys { width: 95%; }
    .stage-2-target {
      left: 12.5%;
      width: 75%;
    }

    /* 個別の黒鍵デザイン */
    .black-key-single {
      width: 28%;
      height: 100%;
      background: linear-gradient(to bottom, #1e293b 0%, #0f172a 100%);
      border-radius: 0 0 6px 6px;
      border: 1px solid #475569;
    }

    /* ガイドアニメーション（黒鍵が光る演出） */
    .target-black-keys.highlight {
      outline: 5px solid #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* =========================================================
       ドラッグ素材エリア（さくらんぼ・串団子）
       ========================================================= */
    .drag-start-zone {
      position: absolute;
      bottom: 8%;
      width: 100%;
      height: 25vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .draggable-item {
      position: absolute;
      width: 130px;
      height: 130px;
      cursor: grab;
      touch-action: none;
      z-index: 100;
      transition: transform 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .draggable-item:active {
      cursor: grabbing;
    }

    .draggable-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* 斜めのお団子をプログラムで真横に回転させるCSS */
    /* ※もし回転角度が足りない、または回りすぎている場合は「-45deg」の数字を増減してください */
    .rotate-dango img {
      transform: rotate(-45deg);
    }

    /* 画像がない場合のフォールバック用イラスト */
    .fallback-icon {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
    }

    /* スナップバック（元の位置に戻る）アニメーション */
    .snap-returning {
      transition: transform 0.3s ease-out !important;
    }

    /* =========================================================
       ステージ3：ごほうび画面
       ========================================================= */
    #reward-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    }

    #reward-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .reward-mark {
      font-size: 150px;
      animation: bounce 0.8s infinite alternate ease-in-out;
      z-index: 1001;
    }

    @keyframes bounce {
      0% { transform: scale(0.8) rotate(-5deg); }
      100% { transform: scale(1.2) rotate(5deg); }
    }

    .touch-prompt-icon {
      margin-top: 20px;
      width: 80px;
      height: 80px;
      background: #ff4757;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 40px;
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
      animation: pulse-button 1.2s infinite;
      z-index: 1001;
    }

    @keyframes pulse-button {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.1); }
      100% { transform: scale(0.95); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 進捗（★）の表示エリア -->
    <div class="progress-bar">
      <div class="star" id="star-1"></div>
      <div class="star" id="star-2"></div>
      <div class="star" id="star-3"></div>
    </div>

    <!-- 鍵盤エリア -->
    <div class="keyboard-area" id="keyboard-area">
      <!-- JavaScriptでステージに応じて鍵盤が動的に挿入されます -->
    </div>

    <!-- ドラッグ素材のスタートエリア -->
    <div class="drag-start-zone" id="drag-zone">
      <div id="draggable" class="draggable-item">
        <img id="item-img" src="sakuranbo.png" alt="イラスト" onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='flex';">
        <div id="fallback-icon" class="fallback-icon" style="display: none;">🍒</div>
      </div>
    </div>
  </div>

  <!-- ステージ3：ごほうび画面 -->
  <div id="reward-screen">
    <canvas id="reward-canvas"></canvas>
    <div class="reward-mark">💮</div>
    <div class="touch-prompt-icon">↻</div>
  </div>

  <script>
    /* =========================================================
       1. ゲームの基本設定・状態変数
       ========================================================= */
    let currentStage = 1; 
    let successCount = 0; 

    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let isDragging = false;

    const HIT_MARGIN = 40; // 当たり判定の余裕度(px)

    const draggable = document.getElementById('draggable');
    const itemImg = document.getElementById('item-img');
    const fallbackIcon = document.getElementById('fallback-icon');
    const keyboardArea = document.getElementById('keyboard-area');
    const rewardScreen = document.getElementById('reward-screen');

    /* =========================================================
       2. Web Audio API による音源作成
       ========================================================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playDingDong() {
      initAudio();
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1318.51, now);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.4);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1046.50, now + 0.15);
      gain2.gain.setValueAtTime(0.3, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.7);
    }

    function playFanfare() {
      initAudio();
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
