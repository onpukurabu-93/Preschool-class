<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>たのしい ピアノあそび</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
      color: #334155;
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    .screen.active { display: flex; }

    /* ===== リセット ===== */
    #btn-reset {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 34px;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.22);
      cursor: pointer;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #btn-reset.pika-pika {
      animation: pikaPikaGlow 1.2s infinite ease-in-out;
      border-color: #fffbeb;
    }

    @keyframes pikaPikaGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 12px #ef4444, 0 0 25px #f59e0b, 0 0 35px #fef08a;
      }
      50% {
        transform: scale(1.18);
        box-shadow: 0 0 30px #f43f5e, 0 0 50px #fbbf24, 0 0 70px #ffffff;
      }
    }

    /* ===== スタート ===== */
    #screen-start {
      background: linear-gradient(135deg, #ffedd5 0%, #fef08a 100%);
      cursor: pointer;
      text-align: center;
    }

    .start-card {
      background: rgba(255,255,255,0.95);
      padding: 3.2rem 2.8rem;
      border-radius: 44px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.12);
      border: 5px solid #fbbf24;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2rem;
      max-width: 90%;
    }

    .start-title {
      font-size: clamp(2rem, 6.5vw, 3.2rem);
      color: #d97706;
      font-weight: bold;
      white-space: nowrap;
    }

    .btn-tonton {
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      padding: 1.1rem 3.8rem;
      border-radius: 50px;
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 100%);
      color: white;
      font-weight: bold;
      border: none;
      box-shadow: 0 8px 25px rgba(225,29,72,0.4);
      animation: pulse 1.8s infinite;
      cursor: pointer;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* ===== ゲーム画面 ===== */
    #screen-game {
      display: none;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
      width: 100vw;
      height: 100vh;
    }

    #screen-game.active { display: flex; }

    .game-sidebar-left {
      width: 31%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* 左の点線の箱。大きさは JavaScript が決める */
    .source-box {
      width: 300px;
      height: 200px;
      background: rgba(255,255,255,0.82);
      border: 5px dashed #38bdf8;
      border-radius: 44px;
      position: relative;
    }

    /* 動かす絵。大きさは JavaScript が鍵盤の絵に合わせて決める */
    #draggable {
      width: 200px;
      height: 120px;
      cursor: grab;
      touch-action: none;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 50;
    }

    #draggable.snap-back {
      transition: transform 0.28s cubic-bezier(0.175,0.885,0.32,1.275);
    }

    #art-slot {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    .emoji-fallback {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 110px;
      line-height: 1;
      display: none;
    }

    /* ===== 中央・鍵盤 ===== */
    .game-center {
      width: 46%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #keyboard-wrapper {
      position: relative;
      width: 100%;
      max-width: 98vw;
      height: 520px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 見えない「ねらいの枠」。ふだんは何も見えない */
    #target-zone {
      position: absolute;
      pointer-events: none;
      z-index: 5;
    }

    #target-zone.adjust-on {
      border: 3px dashed #ef4444;
      background: rgba(239,68,68,0.12);
    }

    /* ===== ピンポン表示 ===== */
    .ping-message {
      position: fixed;
      z-index: 70;
      pointer-events: none;
      font-size: 2rem;
      font-weight: bold;
      color: #f59e0b;
      background: rgba(255,255,255,0.96);
      border: 4px solid #fbbf24;
      border-radius: 30px;
      padding: 8px 22px;
      opacity: 0;
      transform: scale(0.7) translateY(10px);
      white-space: nowrap;
    }

    .ping-message.show { animation: pingShow 0.7s ease-out forwards; }

    @keyframes pingShow {
      0%   { opacity: 0; transform: scale(0.7) translateY(10px); }
      25%  { opacity: 1; transform: scale(1.12) translateY(-5px); }
      65%  { opacity: 1; transform: scale(1) translateY(-12px); }
      100% { opacity: 0; transform: scale(0.95) translateY(-28px); }
    }

    /* ===== ごほうびトレイ ===== */
    .game-sidebar-right {
      width: 23%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .tray-container {
      width: 240px;
      height: 460px;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,0.98), rgba(255,255,255,0.88)),
        linear-gradient(135deg,#fff7ed,#fef3c7);
      border: 6px solid #f59e0b;
      border-radius: 50px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12), 0 0 0 8px rgba(251,191,36,0.12);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .tray-container::before {
      content: "★";
      position: absolute;
      top: 10px;
      left: 16px;
      font-size: 25px;
      color: #fbbf24;
      opacity: 0.75;
      animation: trayStar 1.8s infinite ease-in-out;
    }

    .tray-container::after {
      content: "♪";
      position: absolute;
      bottom: 10px;
      right: 16px;
      font-size: 30px;
      color: #f472b6;
      opacity: 0.7;
    }

    @keyframes trayStar {
      0%,100% { transform: scale(1) rotate(-10deg); opacity: 0.55; }
      50%     { transform: scale(1.25) rotate(10deg); opacity: 1; }
    }

    .tray-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #d97706;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    #tray-area {
      width: 100%;
