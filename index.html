<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>たのしい ピアノあそび</title>
  <style>
    /* =========================================================
       1. 基本スタイル & 画面全体設定
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
      color: #334155;
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    .screen.active {
      display: flex;
    }

    /* 右上固定のリセットボタン（↻） */
    #btn-reset {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 28px;
      font-weight: bold;
      border: 3px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s ease;
    }

    #btn-reset:active {
      transform: scale(0.9);
    }

    /* =========================================================
       2. スタート画面（トントン画面）
       ========================================================= */
    #screen-start {
      background: linear-gradient(135deg, #ffedd5 0%, #fef08a 100%);
      cursor: pointer;
      text-align: center;
    }

    .start-card {
      background: rgba(255, 255, 255, 0.92);
      padding: 2rem 3.5rem;
      border-radius: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 4px solid #fbbf24;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 85%;
    }

    .start-title {
      font-size: 2.4rem;
      color: #d97706;
      font-weight: bold;
      text-shadow: 1px 1px 0px white;
    }

    .btn-tonton {
      font-size: 2rem;
      padding: 1rem 3.5rem;
      border-radius: 50px;
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 100%);
      color: white;
      font-weight: bold;
      border: none;
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.4);
      animation: pulse 1.8s infinite;
      cursor: pointer;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* =========================================================
       3. メインゲーム画面（横画面優先レイアウト）
       ========================================================= */
    #screen-game {
      display: none;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }

    #screen-game.active {
      display: flex;
    }

    /* --- 左エリア：素材エリア --- */
    .game-sidebar-left {
      width: 22%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .source-box {
      width: 130px;
      height: 130px;
      background: rgba(255, 255, 255, 0.7);
      border: 3px dashed #38bdf8;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #draggable {
      width: 110px;
      height: 110px;
      cursor: grab;
      touch-action: none;
      position: absolute;
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #draggable:active {
      cursor: grabbing;
    }

    #draggable.snap-back {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #image-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #item-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    }

    .emoji-fallback {
      font-size: 75px;
      line-height: 1;
      display: none;
    }

    /* --- 中央エリア：鍵盤グラフィック --- */
    .game-center {
      width: 52%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #keyboard-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 320px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 10px;
    }

    /* 標準CSSピアノ鍵盤 */
    .piano-keyboard {
      display: flex;
      position: relative;
      background: #1e293b;
      padding: 8px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    #keyboard-wrapper.has-custom-bg .piano-keyboard {
      opacity: 0;
    }

    .white-key {
      width: 70px;
      height: 220px;
      background: white;
      border: 2px solid #cbd5e1;
      border-radius: 0 0 8px 8px;
      margin: 0 2px;
    }

    /* --- 黒鍵ターゲット判定エリア（完全透明化＆厳格判定） --- */
    .black-keys-target {
      position: absolute;
      top: 8px;
      display: flex;
      gap: 12px;
      padding: 0;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      z-index: 20;
    }

    .stage1-target {
      left: 85px;
      width: 100px;
      height: 130px;
    }

    .stage2-target {
      left: 155px;
      width: 150px;
      height: 130px;
    }

    .black-key {
      width: 42px;
      height: 125px;
      background: #0f172a;
      border-radius: 0 0 6px 6px;
    }

    #keyboard-wrapper.has-custom-bg .black-key {
      opacity: 0;
    }

    /* 画像読み込み時の透明判定領域の位置バランス */
    #keyboard-wrapper.has-custom-bg .stage1-target {
      top: 12%;
      left: 36%;
      width: 28%;
      height: 48%;
    }

    #keyboard-wrapper.has-custom-bg .stage2-target {
      top: 12%;
      left: 32%;
      width: 36%;
      height: 48%;
    }

    /* --- 右エリア：ごほうびトレイ（お皿） --- */
    .game-sidebar-right {
      width: 22%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .tray-container {
      width: 140px;
      height: 250px;
      background: rgba(255, 255, 255, 0.88);
      border: 4px solid #f59e0b;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .tray-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #d97706;
      margin-bottom: 2px;
    }

    #tray-area {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column; /* 横画面（iPad）時は縦並び */
      justify-content: space-around;
      align-items: center;
    }

    .tray-item {
      width: 60px;
      height: 60px;
      object-fit: contain;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* iPad（横画面）時：お団子を横向き「三」にして綺麗に並べる */
    .tray-item-dango {
      transform: rotate(90deg);
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* =========================================================
       4. 全クリア・ごほうび画面（くす玉）
       ========================================================= */
    #screen-reward {
      background: linear-gradient(135deg, #fef08a 0%, #f472b6 100%);
      text-align: center;
      z-index: 30;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 31;
    }

    .reward-content {
      position: relative;
      z-index: 32;
      background: rgba(255, 255, 255, 0.92);
      padding: 2.5rem 4rem;
      border-radius: 40px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .reward-title {
      font-size: 2.8rem;
      color: #e11d48;
      font-weight: bold;
    }

    .reward-emoji {
      font-size: 5rem;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-15px); }
    }

    .btn-replay {
      font-size: 1.5rem;
      padding: 0.8rem 2.5rem;
      border-radius: 40px;
      background: #10b981;
      color: white;
      font-weight: bold;
      border: none;
      box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
      cursor: pointer;
    }

    /* =========================================================
       5. 縦画面（iPhone等）時のレスポンシブ表示調整
       ========================================================= */
    @media (orientation: portrait) {
      #screen-game {
        flex-direction: column;
        justify-content: space-around;
        padding: 1rem;
      }

      .game-sidebar-left, .game-center, .game-sidebar-right {
        width: 100%;
        height: auto;
      }

      .tray-container {
        width: 280px;
        height: 100px;
        flex-direction: column;
      }

      #tray-area {
        flex-direction: row; /* 縦画面時は横一列に並べる */
      }

      /* iPhone（縦画面）時：お団子を縦向き「川」にして綺麗に並べる */
      .tray-item-dango {
        transform: rotate(0deg);
      }
    }
  </style>
</head>
<body>

  <!-- 右上固定コントロール：最初に戻るボタン（↻） -->
  <button id="btn-reset" title="最初に戻る">↻</button>

  <!-- 1. トントン画面（スタート） -->
  <section id="screen-start" class="screen active">
    <div class="start-card">
      <div class="start-title">たのしい ピアノあそび</div>
      <button id="btn-tonton" class="btn-tonton">トントン！</button>
    </div>
  </section>

  <!-- 2. メインゲーム画面（完全一本道フロー） -->
  <section id="screen-game" class="screen">
    <!-- 左：ドラッグ元 -->
    <div class="game-sidebar-left">
      <div class="source-box">
        <div id="draggable">
          <div id="image-container">
            <img id="item-img" src="" alt="アイテム">
          </div>
          <div id="emoji-fallback" class="emoji-fallback">🍒</div>
        </div>
      </div>
    </div>

    <!-- 中央：鍵盤グラフィック -->
    <div class="game-center">
      <div id="keyboard-wrapper">
        <!-- JSで動的に鍵盤および透明判定ターゲット枠を配置 -->
      </div>
    </div>

    <!-- 右：ごほうびトレイ（お皿） -->
    <div class="game-sidebar-right">
      <div class="tray-container">
        <div class="tray-title">できたよ！</div>
        <div id="tray-area"></div>
      </div>
    </div>
  </section>

  <!-- 3. くす玉・全クリア画面 -->
  <section id="screen-reward" class="screen">
    <canvas id="confetti-canvas"></canvas>
    <div class="reward-content">
      <div class="reward-emoji">🎊</div>
      <div class="reward-title">ぜんぶ クリア！</div>
      <button id="btn-replay" class="btn-replay">もう一度あそぶ</button>
    </div>
  </section>

  <!-- =========================================================
     JavaScript（動作制御・音声案内・厳格な黒鍵判定・一本道処理）
     ========================================================= */ -->
  <script>
    /* 1. 画像探査リスト */
    const FILES_STAGE1_BG = ["kenban1.png", "Kenban1.png", "kenban1.PNG", "Kenban1.PNG", "KENBAN1.PNG", "kenban1.jpg", "Kenban1.jpg"];
    const FILES_STAGE2_BG = ["kenban2.png", "Kenban2.png", "kenban2.PNG", "Kenban2.PNG", "KENBAN2.PNG", "kenban2.jpg", "Kenban2.jpg"];
    const FILES_SAKURANBO = ["sakuranbo.png", "Sakuranbo.png", "sakuranbo.PNG", "Sakuranbo.PNG", "SAKURANBO.PNG", "sakuranbo.jpg"];
    const FILES_KUSHIDANGO = ["kushidango.png", "Kushidango.png", "kushidango.PNG", "Kushidango.PNG", "KUSHIDANGO.PNG", "kushidango.jpg"];

    /* 2. ゲーム状態変数 */
    let currentStage = 1;  // 1: さくらんぼ, 2: お団子
    let successCount = 0;  // 正解数 (0〜3)

    let loadedPathSakuranbo = "";
    let loadedPathKushidango = "";

    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;

    /* DOM要素の取得 */
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenReward = document.getElementById('screen-reward');

    const btnTonton = document.getElementById('btn-tonton');
    const btnReset = document.getElementById('btn-reset');
    const btnReplay = document.getElementById('btn-replay');

    const draggable = document.getElementById('draggable');
    const itemImg = document.getElementById('item-img');
    const emojiFallback = document.getElementById('emoji-fallback');
    const keyboardWrapper = document.getElementById('keyboard-wrapper');
    const trayArea = document.getElementById('tray-area');

    /* 3. 画面切り替え */
    function showScreen(targetScreen) {
      [screenStart, screenGame, screenReward].forEach(s => s.classList.remove('active'));
      targetScreen.classList.add('active');
    }

    /* 4. 画像自動探査読み込み */
    function loadImageWithFallback(imgElement, candidates, fallbackEmoji, onSuccessCallback) {
      let index = 0;
      imgElement.style.display = 'block';
      if (emojiFallback) emojiFallback.style.display = 'none';

      imgElement.onerror = function() {
        index++;
        if (index < candidates.length) {
          imgElement.src = candidates[index];
        } else {
          imgElement.style.display = 'none';
          if (emojiFallback) {
            emojiFallback.style.display = 'block';
            emojiFallback.textContent = fallbackEmoji;
          }
        }
      };

      imgElement.onload = function() {
        if (onSuccessCallback) onSuccessCallback(imgElement.src);
      };

      imgElement.src = candidates[0];
    }

    function setKeyboardBackgroundWithFallback(candidates) {
      let index = 0;
      keyboardWrapper.classList.remove('has-custom-bg');

      function tryNext() {
        if (index >= candidates.length) {
          keyboardWrapper.style.backgroundImage = 'none';
          return;
        }
        const img = new Image();
        const testUrl = candidates[index];

        img.onload = function() {
          keyboardWrapper.style.backgroundImage = `url('${testUrl}')`;
          keyboardWrapper.classList.add('has-custom-bg');
        };

        img.onerror = function() {
          index++;
          tryNext();
        };

        img.src = testUrl;
      }

      tryNext();
    }

    /* 5. Web Audio API & 音声案内 */
    let audioCtx = null;
    let isAudioUnlocked = false;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
    }

    function unlockAudio() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (audioCtx && !isAudioUnlocked) {
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        isAudioUnlocked = true;
      }
      if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance('');
        dummy.volume = 0;
        window.speechSynthesis.speak(dummy);
      }
    }

    function speakGuide(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.92;
      utterance.pitch = 1.25;

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang.includes('ja') || v.lang.includes('JP'));
      if (jaVoice) utterance.voice = jaVoice;

      setTimeout(() => {
        window.speechSynthesis.speak(utterance);
      }, 150);
    }

    function playDingDong() {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1318.51, now);
      gain1.gain.setValueAtTime(0.35, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.4);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1046.50, now + 0.15);
      gain2.gain.setValueAtTime(0.35, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.7);
    }

    function playFanfare() {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        const duration = (idx === notes.length - 1) ? 0.7 : 0.12;
        gain.gain.setValueAtTime(0.3, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + duration);
      });
    }

    function playGrandTaDa() {
      unlockAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const chord = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];

      chord.forEach((freq) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 2.5);
      });
    }

    /* 6. ステージ構築 */
    function startStage(stageNum) {
      currentStage = stageNum;
      successCount = 0;
      trayArea.innerHTML = '';
      resetDraggablePosition();

      if (stageNum === 1) {
        // ステージ1：さくらんぼ
        setKeyboardBackgroundWithFallback(FILES_STAGE1_BG);
        loadImageWithFallback(itemImg, FILES_SAKURANBO, "🍒", path => {
          loadedPathSakuranbo = path;
        });

        keyboardWrapper.innerHTML = `
          <div class="piano-keyboard">
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="black-keys-target stage1-target" id="target-area">
              <div class="black-key"></div>
              <div class="black-key"></div>
            </div>
          </div>
        `;

        showScreen(screenGame);
        speakGuide("さくらんぼを くろい けんばんの上に おいてね");

      } else if (stageNum === 2) {
        // ステージ2：お団子
        setKeyboardBackgroundWithFallback(FILES_STAGE2_BG);
        loadImageWithFallback(itemImg, FILES_KUSHIDANGO, "🍡", path => {
          loadedPathKushidango = path;
        });

        keyboardWrapper.innerHTML = `
          <div class="piano-keyboard">
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="black-keys-target stage2-target" id="target-area">
              <div class="black-key"></div>
              <div class="black-key"></div>
              <div class="black-key"></div>
            </div>
          </div>
        `;

        showScreen(screenGame);
        speakGuide("つぎはおだんごだよ！くろい けんばんの上に おいてね");
      }
    }

    /* お皿にごほうびアイテムを追加 */
    function addItemToTray() {
      const trayImg = document.createElement('img');

      if (currentStage === 1) {
        trayImg.className = 'tray-item';
        trayImg.src = loadedPathSakuranbo || itemImg.src;
      } else {
        trayImg.className = 'tray-item tray-item-dango';
        trayImg.src = loadedPathKushidango || itemImg.src;
      }

      trayArea.appendChild(trayImg);
    }

    /* 7. ドラッグ＆ドロップおよび【厳格な黒鍵判定】 */
    function getEventPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function handleDragStart(e) {
      unlockAudio();
      if (isDragging) return;
      isDragging = true;

      draggable.classList.remove('snap-back');

      const pos = getEventPos(e);
      startX = pos.x - currentX;
      startY = pos.y - currentY;

      if (e.cancelable) e.preventDefault();
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();

      const pos = getEventPos(e);
      currentX = pos.x - startX;
      currentY = pos.y - startY;

      draggable.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px)`;
    }

    function handleDragEnd() {
      if (!isDragging) return;
      isDragging = false;

      const targetArea = document.getElementById('target-area');
      if (!targetArea) return;

      const itemRect = draggable.getBoundingClientRect();
      const targetRect = targetArea.getBoundingClientRect();

      // 移動中の素材の中心点
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;

      /* =========================================================
         【厳格な黒鍵判定ロジック】
         ・左右の許容幅（MARGIN_X）：20px
         ・上の許容幅（MARGIN_Y_TOP）：15px
         ・下の許容幅（MARGIN_Y_BOTTOM）：5px（※白鍵への判定を完全にカット！）
         ========================================================= */
      const MARGIN_X = 20;
      const MARGIN_Y_TOP = 15;
      const MARGIN_Y_BOTTOM = 5; // 黒鍵の下端を超えて白鍵に落ちた場合は不正解

      const isHit =
        itemCenterX >= (targetRect.left - MARGIN_X) &&
        itemCenterX <= (targetRect.right + MARGIN_X) &&
        itemCenterY >= (targetRect.top - MARGIN_Y_TOP) &&
        itemCenterY <= (targetRect.bottom + MARGIN_Y_BOTTOM);

      if (isHit) {
        // 正解（黒鍵の真上）
        playDingDong();
        successCount++;
        addItemToTray();
        resetDraggablePosition();

        if (successCount >= 3) {
          setTimeout(() => {
            playFanfare();

            if (currentStage === 1) {
              // ステージ1クリア → 自動的にステージ2（お団子）へ
              setTimeout(() => {
                startStage(2);
              }, 1200);
            } else if (currentStage === 2) {
              // ステージ2クリア → 全クリア画面へ
              setTimeout(() => {
                showRewardScreen();
              }, 1200);
            }
          }, 300);

        } else {
          setTimeout(() => {
            if (currentStage === 1) speakGuide("もういちど！さくらんぼを おいてね");
            else speakGuide("もういちど！おだんごを おいてね");
          }, 500);
        }

      } else {
        // 不正解（白鍵の上や外れた場所）：元の位置へスッと戻る
        draggable.classList.add('snap-back');
        currentX = 0;
        currentY = 0;
        draggable.style.transform = 'translate3d(0px, 0px, 0px)';
      }
    }

    function resetDraggablePosition() {
      draggable.classList.remove('snap-back');
      currentX = 0;
      currentY = 0;
      draggable.style.transform = 'translate3d(0px, 0px, 0px)';
    }

    /* イベント登録 */
    draggable.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd, { passive: false });

    draggable.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);

    /* 8. くす玉・紙吹雪演出 */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId = null;

    function showRewardScreen() {
      showScreen(screenReward);
      playGrandTaDa();
      startConfetti();
      speakGuide("ぜんぶクリア！おめでとう！すごーい！");
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function startConfetti() {
      resizeCanvas();
      particles = [];
      const colors = ['#f43f5e', '#0ea5e9', '#eab308', '#22c55e', '#a855f7', '#ec4899'];

      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 14 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vy: Math.random() * 3 + 2,
          vx: Math.random() * 2 - 1,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 4 - 2
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        p.y += p.vy;
        p.x += p.vx;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      animationId = requestAnimationFrame(renderConfetti);
    }

    function stopConfetti() {
      if (animationId) cancelAnimationFrame(animationId);
    }

    /* 9. ボタン操作＆リセット処理 */
    btnTonton.addEventListener('click', () => {
      unlockAudio();
      startStage(1);
    });

    screenStart.addEventListener('click', (e) => {
      if (e.target === screenStart) {
        unlockAudio();
        startStage(1);
      }
    });

    btnReset.addEventListener('click', () => {
      stopConfetti();
      showScreen(screenStart);
    });

    btnReplay.addEventListener('click', () => {
      stopConfetti();
      showScreen(screenStart);
    });

    /* 初期化 */
    function initGame() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
