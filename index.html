<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>たのしい ピアノあそび</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family:
        'Hiragino Maru Gothic ProN',
        'Rounded Mplus 1c',
        'Meiryo',
        sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
      color: #334155;
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    .screen.active {
      display: flex;
    }

    /* =========================================================
       リセット
       ========================================================= */

    #btn-reset {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      font-size: 34px;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.22);
      cursor: pointer;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #btn-reset.pika-pika {
      animation: pikaPikaGlow 1.2s infinite ease-in-out;
      border-color: #fffbeb;
    }

    @keyframes pikaPikaGlow {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 12px #ef4444,
          0 0 25px #f59e0b,
          0 0 35px #fef08a;
      }

      50% {
        transform: scale(1.18);
        box-shadow:
          0 0 30px #f43f5e,
          0 0 50px #fbbf24,
          0 0 70px #ffffff;
      }
    }

    /* =========================================================
       スタート
       ========================================================= */

    #screen-start {
      background: linear-gradient(135deg, #ffedd5 0%, #fef08a 100%);
      cursor: pointer;
      text-align: center;
    }

    .start-card {
      background: rgba(255,255,255,0.95);
      padding: 3.2rem 2.8rem;
      border-radius: 44px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.12);
      border: 5px solid #fbbf24;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2rem;
      max-width: 90%;
    }

    .start-title {
      font-size: clamp(2rem, 6.5vw, 3.2rem);
      color: #d97706;
      font-weight: bold;
      white-space: nowrap;
    }

    .btn-tonton {
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      padding: 1.1rem 3.8rem;
      border-radius: 50px;
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 100%);
      color: white;
      font-weight: bold;
      border: none;
      box-shadow: 0 8px 25px rgba(225,29,72,0.4);
      animation: pulse 1.8s infinite;
      cursor: pointer;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* =========================================================
       ゲーム画面
       ========================================================= */

    #screen-game {
      display: none;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
      width: 100vw;
      height: 100vh;
    }

    #screen-game.active {
      display: flex;
    }

    .game-sidebar-left {
      width: 28%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .source-box {
      width: 380px;
      height: 380px;
      background: rgba(255,255,255,0.82);
      border: 5px dashed #38bdf8;
      border-radius: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #draggable {
      width: 290px;
      height: 290px;
      cursor: grab;
      touch-action: none;
      position: absolute;
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #draggable.stage2-size {
      width: 380px;
      height: 380px;
    }

    #draggable.snap-back {
      transition:
        transform 0.28s cubic-bezier(0.175,0.885,0.32,1.275);
    }

    #image-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #item-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.25));
    }

    .emoji-fallback {
      font-size: 130px;
      line-height: 1;
      display: none;
    }

    .is-dango {
      transform: rotate(0deg) !important;
    }

    /* =========================================================
       中央・鍵盤
       ========================================================= */

    .game-center {
      width: 48%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #keyboard-wrapper {
      position: relative;
      width: 100%;
      max-width: 98vw;
      height: 520px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 10px;
    }

    /*
     * 元の鍵盤画像を使うときは、
     * HTMLの鍵盤そのものは見せない。
     * これで鍵盤画像を二重に描かない。
     */

    .piano-keyboard {
      display: flex;
      position: relative;
      background: #1e293b;
      padding: 14px;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.28);
    }

    #keyboard-wrapper.has-custom-bg .piano-keyboard {
      opacity: 0;
      pointer-events: none;
    }

    .white-key {
      width: 130px;
      height: 420px;
      background: white;
      border: 4px solid #cbd5e1;
      border-radius: 0 0 18px 18px;
      margin: 0 5px;
    }

    .black-keys-target {
      position: absolute;
      top: 14px;
      display: flex;
      gap: 22px;
      padding: 0;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      z-index: 2;
    }

    .stage1-target {
      left: 155px;
      width: 190px;
      height: 250px;
    }

    .stage2-target {
      left: 280px;
      width: 320px;
      height: 250px;
    }

    .black-key {
      width: 82px;
      height: 250px;
      background: #0f172a;
      border-radius: 0 0 12px 12px;
    }

    #keyboard-wrapper.has-custom-bg .black-key {
      opacity: 0;
    }

    /*
     * =========================================================
     * 黒鍵の「ここですよ」ガイド
     * =========================================================
     *
     * 鍵盤全体を覆わず、
     * 黒鍵2本・3本の位置だけに光を出す。
     */

    .target-guide {
      position: absolute;
      z-index: 8;
      pointer-events: none;
      opacity: 0.9;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .target-guide.near {
      opacity: 1;
      transform: scale(1.08);
    }

    .target-guide::after {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255,214,0,0.48) 0%,
        rgba(255,214,0,0.25) 48%,
        rgba(255,214,0,0) 72%
      );
      filter: blur(5px);
      animation: guideGlow 1.15s infinite ease-in-out;
      z-index: -1;
    }

    @keyframes guideGlow {
      0%,100% {
        opacity: 0.65;
        transform: scale(0.92);
      }

      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    /*
     * さくらんぼ
     * 2つの実を、黒鍵2本の位置に置く。
     */

    .cherry-guide {
      width: 178px;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .cherry-guide .guide-fruit {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255,255,255,0.75) 0 8%,
          transparent 9%
        ),
        radial-gradient(
          circle at 50% 55%,
          #fff36b 0%,
          #ffd000 52%,
          #f5ad00 100%
        );
      box-shadow:
        0 0 10px rgba(255,214,0,0.8),
        0 0 25px rgba(255,214,0,0.6);
      position: relative;
    }

    .cherry-guide .guide-fruit::before {
      content: "";
      position: absolute;
      width: 42px;
      height: 24px;
      border-top: 7px solid rgba(255,190,0,0.95);
      border-radius: 50%;
      top: -10px;
      left: 25px;
      transform: rotate(-20deg);
    }

    /*
     * 串だんご
     * 3つの丸を黒鍵3本の位置に合わせる。
     */

    .dango-guide {
      width: 285px;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .dango-guide .guide-dango {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 28%,
          rgba(255,255,255,0.8) 0 8%,
          transparent 9%
        ),
        radial-gradient(
          circle,
          #fff36b 0%,
          #ffd000 55%,
          #f4aa00 100%
        );
      box-shadow:
        0 0 10px rgba(255,214,0,0.8),
        0 0 25px rgba(255,214,0,0.6);
      position: relative;
    }

    .dango-guide .guide-stick {
      position: absolute;
      width: 255px;
      height: 9px;
      background: #d18a36;
      border-radius: 10px;
      z-index: -1;
      left: 15px;
    }

    /*
     * 黒鍵の中心付近にガイドを置く
     */

    .stage1-guide-position {
      left: 155px;
      top: 155px;
    }

    .stage2-guide-position {
      left: 300px;
      top: 155px;
    }

    /* =========================================================
       ピンポン表示
       ========================================================= */

    .ping-message {
      position: absolute;
      z-index: 70;
      pointer-events: none;
      font-size: 2rem;
      font-weight: bold;
      color: #f59e0b;
      background: rgba(255,255,255,0.96);
      border: 4px solid #fbbf24;
      border-radius: 30px;
      padding: 8px 22px;
      opacity: 0;
      transform: scale(0.7) translateY(10px);
      white-space: nowrap;
    }

    .ping-message.show {
      animation: pingShow 0.7s ease-out forwards;
    }

    @keyframes pingShow {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(10px);
      }

      25% {
        opacity: 1;
        transform: scale(1.12) translateY(-5px);
      }

      65% {
        opacity: 1;
        transform: scale(1) translateY(-12px);
      }

      100% {
        opacity: 0;
        transform: scale(0.95) translateY(-28px);
      }
    }

    /* =========================================================
       ごほうびトレイ
       ========================================================= */

    .game-sidebar-right {
      width: 24%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .tray-container {
      width: 240px;
      height: 460px;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255,255,255,0.98),
          rgba(255,255,255,0.88)
        ),
        linear-gradient(135deg,#fff7ed,#fef3c7);
      border: 6px solid #f59e0b;
      border-radius: 50px;
      box-shadow:
        0 12px 30px rgba(0,0,0,0.12),
        0 0 0 8px rgba(251,191,36,0.12);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .tray-container::before {
      content: "★";
      position: absolute;
      top: 10px;
      left: 16px;
      font-size: 25px;
      color: #fbbf24;
      opacity: 0.75;
      animation: trayStar 1.8s infinite ease-in-out;
    }

    .tray-container::after {
      content: "♪";
      position: absolute;
      bottom: 10px;
      right: 16px;
      font-size: 30px;
      color: #f472b6;
      opacity: 0.7;
    }

    @keyframes trayStar {
      0%,100% {
        transform: scale(1) rotate(-10deg);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.25) rotate(10deg);
        opacity: 1;
      }
    }

    .tray-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #d97706;
      margin-bottom: 6px;
      position: relative;
      z-index: 2;
    }

    #tray-area {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .tray-item {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.18));
    }

    .tray-item-dango {
      transform: rotate(0deg) !important;
    }

    /*
     * お皿に入った後のポップ
     */

    .tray-item.pop-in {
      animation:
        trayPop 0.45s
        cubic-bezier(0.175,0.885,0.32,1.275);
    }

    @keyframes trayPop {
      0% {
        transform: scale(0.1);
        opacity: 0;
      }

      70% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /*
     * ピューッと飛んでいくコピー
     */

    .flying-item {
      position: fixed;
      z-index: 90;
      pointer-events: none;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.25));
      transition:
        left 0.55s cubic-bezier(0.4,0,0.2,1),
        top 0.55s cubic-bezier(0.4,0,0.2,1),
        width 0.55s cubic-bezier(0.4,0,0.2,1),
        height 0.55s cubic-bezier(0.4,0,0.2,1),
        transform 0.55s cubic-bezier(0.4,0,0.2,1),
        opacity 0.55s ease;
    }

    /* =========================================================
       全クリア
       ========================================================= */

    #screen-reward {
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255,255,255,0.55),
          transparent 25%
        ),
        radial-gradient(
          circle at 80% 30%,
          rgba(255,255,255,0.45),
          transparent 25%
        ),
        linear-gradient(135deg,#fef08a 0%,#f472b6 100%);
      text-align: center;
      z-index: 30;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 31;
    }

    .reward-content {
      position: relative;
      z-index: 32;
      background: rgba(255,255,255,0.95);
      padding: 3rem 4rem;
      border-radius: 48px;
      box-shadow:
        0 18px 40px rgba(0,0,0,0.15),
        0 0 0 8px rgba(255,255,255,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 90%;
    }

    .reward-title {
      font-size: clamp(2rem,6.5vw,3.2rem);
      color: #e11d48;
      font-weight: bold;
      white-space: nowrap;
    }

    .reward-emoji {
      font-size: 6.5rem;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }

    .btn-replay {
      font-size: clamp(1.4rem,4.8vw,2rem);
      padding: 1rem 3.5rem;
      border-radius: 45px;
      background: linear-gradient(180deg,#34d399 0%,#10b981 100%);
      color: white;
      font-weight: bold;
      border: 4px solid white;
      box-shadow: 0 8px 20px rgba(16,185,129,0.4);
      cursor: pointer;
      white-space: nowrap;
      animation: replayPika 1.4s infinite ease-in-out;
    }

    @keyframes replayPika {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    /* =========================================================
       iPhone 縦
       ========================================================= */

    @media (orientation: portrait) {

      #screen-game {
        flex-direction: column;
        justify-content: space-around;
        padding: 1rem;
      }

      .game-sidebar-left,
      .game-center,
      .game-sidebar-right {
        width: 100%;
        height: auto;
      }

      .source-box {
        width: 220px;
        height: 220px;
      }

      #draggable {
        width: 120px;
        height: 120px;
      }

      #draggable.stage2-size {
        width: 240px;
        height: 240px;
      }

      #keyboard-wrapper {
        max-width: 100%;
        height: 310px;
      }

      .tray-container {
        width: 330px;
        height: 130px;
        flex-direction: column;
      }

      #tray-area {
        flex-direction: row;
      }

      .stage1-guide-position {
        left: 86px;
        top: 95px;
      }

      .stage2-guide-position {
        left: 150px;
        top: 95px;
      }

      .cherry-guide {
        width: 108px;
        height: 65px;
        gap: 2px;
      }

      .cherry-guide .guide-fruit {
        width: 50px;
        height: 50px;
      }

      .dango-guide {
        width: 170px;
        height: 65px;
        gap: 2px;
      }

      .dango-guide .guide-dango {
        width: 50px;
        height: 50px;
      }

      .dango-guide .guide-stick {
        width: 155px;
        height: 6px;
        left: 8px;
      }
    }
  </style>
</head>

<body>

  <button id="btn-reset" title="最初に戻る">↻</button>

  <!-- =========================================================
       スタート
       ========================================================= -->

  <section id="screen-start" class="screen active">
    <div class="start-card">
      <div class="start-title">たのしい ピアノあそび</div>
      <button id="btn-tonton" class="btn-tonton">
        トントン！
      </button>
    </div>
  </section>

  <!-- =========================================================
       ゲーム
       ========================================================= -->

  <section id="screen-game" class="screen">

    <!-- 左：アイテム -->
    <div class="game-sidebar-left">

      <div class="source-box">

        <div id="draggable">

          <div id="image-container">
            <img id="item-img" src="" alt="アイテム">
          </div>

          <div id="emoji-fallback" class="emoji-fallback">
            🍒
          </div>

        </div>

      </div>

    </div>


    <!-- 中央：鍵盤 -->
    <div class="game-center">

      <div id="keyboard-wrapper">

        <!-- ここに元の鍵盤画像 -->

        <!-- さくらんぼ用ガイド -->
        <div
          id="cherry-guide"
          class="target-guide cherry-guide stage1-guide-position"
        >
          <div class="guide-fruit"></div>
          <div class="guide-fruit"></div>
        </div>


        <!-- だんご用ガイド -->
        <div
          id="dango-guide"
          class="target-guide dango-guide stage2-guide-position"
          style="display:none;"
        >
          <div class="guide-stick"></div>
          <div class="guide-dango"></div>
          <div class="guide-dango"></div>
          <div class="guide-dango"></div>
        </div>


        <!-- ピンポン表示 -->
        <div id="ping-message" class="ping-message">
          ピンポン♪
        </div>

      </div>

    </div>


    <!-- 右：できたよ -->
    <div class="game-sidebar-right">

      <div class="tray-container">

        <div class="tray-title">
          できたよ！
        </div>

        <div id="tray-area"></div>

      </div>

    </div>

  </section>


  <!-- =========================================================
       全クリア
       ========================================================= -->

  <section id="screen-reward" class="screen">

    <canvas id="confetti-canvas"></canvas>

    <div class="reward-content">

      <div class="reward-emoji">
        🎊
      </div>

      <div class="reward-title">
        ぜんぶ クリア！
      </div>

      <button id="btn-replay" class="btn-replay">
        もう一度あそぶ
      </button>

    </div>

  </section>


  <script>

    /* =========================================================
       1. ファイル
       ========================================================= */

    const FILES_STAGE1_BG = [
      "kenban1.png",
      "Kenban1.png",
      "kenban1.PNG",
      "Kenban1.PNG",
      "KENBAN1.PNG",
      "kenban1.jpg"
    ];

    const FILES_STAGE2_BG = [
      "kenban2.png",
      "Kenban2.png",
      "kenban2.PNG",
      "Kenban2.PNG",
      "KENBAN2.PNG",
      "kenban2.jpg"
    ];

    const FILES_SAKURANBO = [
      "sakuranbo.png",
      "Sakuranbo.png",
      "sakuranbo.PNG",
      "Sakuranbo.PNG",
      "SAKURANBO.PNG",
      "sakuranbo.jpg"
    ];

    const FILES_KUSHIDANGO = [
      "kushidango.png",
      "Kushidango.png",
      "kushidango.PNG",
      "Kushidango.PNG",
      "KUSHIDANGO.PNG",
      "kushidango.jpg"
    ];


    /* =========================================================
       2. 状態
       ========================================================= */

    let currentStage = 1;
    let successCount = 0;
    let isLocked = false;

    let loadedPathSakuranbo = "";
    let loadedPathKushidango = "";

    let isDragging = false;

    let startX = 0;
    let startY = 0;

    let currentX = 0;
    let currentY = 0;

    let hasPinged = false;


    /* =========================================================
       3. DOM
       ========================================================= */

    const screenStart =
      document.getElementById("screen-start");

    const screenGame =
      document.getElementById("screen-game");

    const screenReward =
      document.getElementById("screen-reward");

    const btnTonton =
      document.getElementById("btn-tonton");

    const btnReset =
      document.getElementById("btn-reset");

    const btnReplay =
      document.getElementById("btn-replay");

    const draggable =
      document.getElementById("draggable");

    const itemImg =
      document.getElementById("item-img");

    const emojiFallback =
      document.getElementById("emoji-fallback");

    const keyboardWrapper =
      document.getElementById("keyboard-wrapper");

    const trayArea =
      document.getElementById("tray-area");

    const cherryGuide =
      document.getElementById("cherry-guide");

    const dangoGuide =
      document.getElementById("dango-guide");

    const pingMessage =
      document.getElementById("ping-message");


    /* =========================================================
       4. 音声
       ========================================================= */

    const audioPlayer = new Audio();

    function unlockAudioIOS() {

      audioPlayer.src =
        "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";

      audioPlayer.play().catch(() => {});

    }


    function playMp3(filename, onEndedCallback) {

      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.src = filename;

      let hasExecuted = false;
      let safeTimeoutId = null;

      const finishHandler = () => {

        if (!hasExecuted) {

          hasExecuted = true;

          if (safeTimeoutId) {
            clearTimeout(safeTimeoutId);
          }

          audioPlayer.onended = null;
          audioPlayer.onerror = null;

          if (onEndedCallback) {
            onEndedCallback();
          }
        }
      };

      if (onEndedCallback) {

        audioPlayer.onended = finishHandler;
        audioPlayer.onerror = finishHandler;

        safeTimeoutId =
          setTimeout(finishHandler, 6000);

      } else {

        audioPlayer.onended = null;
        audioPlayer.onerror = null;
      }

      audioPlayer.play().catch(err => {

        console.log(
          "Audio play failed:",
          filename,
          err
        );

        finishHandler();

      });
    }


    /* =========================================================
       5. ピンポン音
       ========================================================= */

    let audioContext = null;

    function playPing() {

      try {

        if (!audioContext) {
          audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const now =
          audioContext.currentTime;

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          880,
          now
        );

        oscillator.frequency.setValueAtTime(
          1320,
          now + 0.08
        );

        gain.gain.setValueAtTime(
          0.0001,
          now
        );

        gain.gain.exponentialRampToValueAtTime(
          0.18,
          now + 0.015
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.22
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + 0.23);

      } catch (e) {

        console.log("ping sound error", e);

      }
    }


    /* =========================================================
       6. 画面切り替え
       ========================================================= */

    function showScreen(targetScreen) {

      [
        screenStart,
        screenGame,
        screenReward
      ].forEach(s => {
        s.classList.remove("active");
      });

      targetScreen.classList.add("active");

      if (targetScreen !== screenReward) {
        btnReset.classList.remove("pika-pika");
      }
    }


    /* =========================================================
       7. 画像読み込み
       ========================================================= */

    function loadImageWithFallback(
      imgElement,
      candidates,
      fallbackEmoji,
      onSuccessCallback
    ) {

      let index = 0;

      imgElement.style.display = "block";

      if (emojiFallback) {
        emojiFallback.style.display = "none";
      }

      imgElement.onerror = function() {

        index++;

        if (index < candidates.length) {

          imgElement.src =
            candidates[index];

        } else {

          imgElement.style.display =
            "none";

          if (emojiFallback) {

            emojiFallback.style.display =
              "block";

            emojiFallback.textContent =
              fallbackEmoji;
          }
        }
      };

      imgElement.onload = function() {

        if (onSuccessCallback) {
          onSuccessCallback(
            imgElement.src
          );
        }
      };

      imgElement.src = candidates[0];
    }


    function setKeyboardBackgroundWithFallback(
      candidates
    ) {

      let index = 0;

      keyboardWrapper.classList.remove(
        "has-custom-bg"
      );

      function tryNext() {

        if (index >= candidates.length) {

          keyboardWrapper.style.backgroundImage =
            "none";

          return;
        }

        const img = new Image();

        const testUrl =
          candidates[index];

        img.onload = function() {

          keyboardWrapper.style.backgroundImage =
            `url('${testUrl}')`;

          keyboardWrapper.classList.add(
            "has-custom-bg"
          );
        };

        img.onerror = function() {

          index++;

          tryNext();
        };

        img.src = testUrl;
      }

      tryNext();
    }


    /* =========================================================
       8. ガイド表示
       ========================================================= */

    function updateGuide() {

      if (currentStage === 1) {

        cherryGuide.style.display = "flex";
        dangoGuide.style.display = "none";

      } else {

        cherryGuide.style.display = "none";
        dangoGuide.style.display = "flex";
      }
    }


    /* =========================================================
       9. ステージ
       ========================================================= */

    function startStage(stageNum) {

      currentStage = stageNum;
      successCount = 0;
      isLocked = false;
      hasPinged = false;

      trayArea.innerHTML = "";

      resetDraggablePosition();

      updateGuide();

      if (stageNum === 1) {

        draggable.classList.remove(
          "stage2-size"
        );

        itemImg.classList.remove(
          "is-dango"
        );

        setKeyboardBackgroundWithFallback(
          FILES_STAGE1_BG
        );

        loadImageWithFallback(
          itemImg,
          FILES_SAKURANBO,
          "🍒",
          path => {
            loadedPathSakuranbo = path;
          }
        );

        showScreen(screenGame);

      } else {

        draggable.classList.add(
          "stage2-size"
        );

        itemImg.classList.add(
          "is-dango"
        );

        setKeyboardBackgroundWithFallback(
          FILES_STAGE2_BG
        );

        loadImageWithFallback(
          itemImg,
          FILES_KUSHIDANGO,
          "🍡",
          path => {
            loadedPathKushidango = path;
          }
        );

        showScreen(screenGame);

        playMp3("start2.mp3");
      }
    }


    /* =========================================================
       10. お皿へピューッ
       ========================================================= */

    function flyToTray(onComplete) {

      const sourceRect =
        draggable.getBoundingClientRect();

      const sourceCenterX =
        sourceRect.left +
        sourceRect.width / 2;

      const sourceCenterY =
        sourceRect.top +
        sourceRect.height / 2;


      const trayRect =
        trayArea.getBoundingClientRect();

      const targetCenterX =
        trayRect.left +
        trayRect.width / 2;

      const targetCenterY =
        trayRect.top +
        trayRect.height / 2;


      const flying =
        document.createElement("img");

      flying.className =
        "flying-item";

      flying.src =
        currentStage === 1
          ? (loadedPathSakuranbo || itemImg.src)
          : (loadedPathKushidango || itemImg.src);


      const startSize =
        Math.min(
          sourceRect.width,
          sourceRect.height
        );

      flying.style.width =
        startSize + "px";

      flying.style.height =
        startSize + "px";

      flying.style.left =
        (sourceCenterX - startSize / 2) + "px";

      flying.style.top =
        (sourceCenterY - startSize / 2) + "px";

      flying.style.transform =
        "scale(1) rotate(0deg)";

      flying.style.opacity = "1";

      document.body.appendChild(flying);


      /*
       * 少し待ってから移動開始。
       * 「そこからピューッと飛ぶ」が見える。
       */

      requestAnimationFrame(() => {

        requestAnimationFrame(() => {

          const endSize =
            currentStage === 1
              ? 65
              : 80;

          flying.style.left =
            (targetCenterX - endSize / 2) +
            "px";

          flying.style.top =
            (targetCenterY - endSize / 2) +
            "px";

          flying.style.width =
            endSize + "px";

          flying.style.height =
            endSize + "px";

          flying.style.transform =
            "scale(0.72) rotate(12deg)";

          flying.style.opacity =
            "0.75";
        });
      });


      setTimeout(() => {

        flying.remove();

        addItemToTray();

        if (onComplete) {
          onComplete();
        }

      }, 570);
    }


    /* =========================================================
       11. お皿に追加
       ========================================================= */

    function addItemToTray() {

      const trayImg =
        document.createElement("img");

      if (currentStage === 1) {

        trayImg.className =
          "tray-item";

        trayImg.src =
          loadedPathSakuranbo ||
          itemImg.src;

      } else {

        trayImg.className =
          "tray-item tray-item-dango";

        trayImg.src =
          loadedPathKushidango ||
          itemImg.src;
      }

      trayArea.appendChild(trayImg);

      requestAnimationFrame(() => {
        trayImg.classList.add("pop-in");
      });
    }


    /* =========================================================
       12. 座標
       ========================================================= */

    function getEventPos(e) {

      if (
        e.touches &&
        e.touches.length > 0
      ) {

        return {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      }

      return {
        x: e.clientX,
        y: e.clientY
      };
    }


    /* =========================================================
       13. 「ここですよ」判定
       ========================================================= */

    function checkNearGuide() {

      if (!isDragging || isLocked) {
        return;
      }

      const itemRect =
        draggable.getBoundingClientRect();

      const itemCenterX =
        itemRect.left +
        itemRect.width / 2;

      const itemCenterY =
        itemRect.top +
        itemRect.height / 2;


      const guideRect =
        currentStage === 1
          ? cherryGuide.getBoundingClientRect()
          : dangoGuide.getBoundingClientRect();


      /*
       * 中心がガイドの中に入ったら
       * 「ここですよ」の反応。
       */

      const margin =
        currentStage === 1
          ? 45
          : 55;

      const near =
        itemCenterX >=
          guideRect.left - margin &&
        itemCenterX <=
          guideRect.right + margin &&
        itemCenterY >=
          guideRect.top - margin &&
        itemCenterY <=
          guideRect.bottom + margin;


      if (near) {

        if (!hasPinged) {

          hasPinged = true;

          playPing();

          cherryGuide.classList.add("near");
          dangoGuide.classList.add("near");

          showPingMessage();
        }

      } else {

        hasPinged = false;

        cherryGuide.classList.remove("near");
        dangoGuide.classList.remove("near");
      }
    }


    /* =========================================================
       14. ピンポン表示
       ========================================================= */

    function showPingMessage() {

      pingMessage.classList.remove("show");

      const guide =
        currentStage === 1
          ? cherryGuide
          : dangoGuide;

      const rect =
        guide.getBoundingClientRect();

      pingMessage.style.left =
        (
          rect.left +
          rect.width / 2 -
          65
        ) + "px";

      pingMessage.style.top =
        (
          rect.top -
          55
        ) + "px";


      void pingMessage.offsetWidth;

      pingMessage.classList.add("show");
    }


    /* =========================================================
       15. ドラッグ開始
       ========================================================= */

    function handleDragStart(e) {

      unlockAudioIOS();

      if (isDragging || isLocked) {
        return;
      }

      isDragging = true;
      hasPinged = false;

      draggable.classList.remove(
        "snap-back"
      );

      const pos =
        getEventPos(e);

      startX =
        pos.x - currentX;

      startY =
        pos.y - currentY;

      if (e.cancelable) {
        e.preventDefault();
      }
    }


    /* =========================================================
       16. ドラッグ中
       ========================================================= */

    function handleDragMove(e) {

      if (!isDragging) {
        return;
      }

      if (e.cancelable) {
        e.preventDefault();
      }

      const pos =
        getEventPos(e);

      currentX =
        pos.x - startX;

      currentY =
        pos.y - startY;


      draggable.style.transform =
        `translate3d(
          ${currentX}px,
          ${currentY}px,
          0px
        )`;


      /*
       * 動かしている途中で
       * 黒鍵の場所に近づいたら反応。
       */

      checkNearGuide();
    }


    /* =========================================================
       17. ドラッグ終了
       ========================================================= */

    function handleDragEnd() {

      if (!isDragging) {
        return;
      }

      isDragging = false;

      const guide =
        currentStage === 1
          ? cherryGuide
          : dangoGuide;

      const guideRect =
        guide.getBoundingClientRect();


      const itemRect =
        draggable.getBoundingClientRect();

      const itemCenterX =
        itemRect.left +
        itemRect.width / 2;

      const itemCenterY =
        itemRect.top +
        itemRect.height / 2;


      /*
       * ガイドの範囲。
       * 少しだけ余裕を持たせているので、
       * 小さい子が完全な位置合わせを
       * しなくても成功しやすい。
       */

      const MARGIN_X =
        currentStage === 1
          ? 28
          : 38;

      const MARGIN_Y_TOP = 35;
      const MARGIN_Y_BOTTOM = 35;


      const isHit =
        itemCenterX >=
          guideRect.left - MARGIN_X &&

        itemCenterX <=
          guideRect.right + MARGIN_X &&

        itemCenterY >=
          guideRect.top - MARGIN_Y_TOP &&

        itemCenterY <=
          guideRect.bottom + MARGIN_Y_BOTTOM;


      guide.classList.remove("near");
      hasPinged = false;


      if (isHit) {

        /*
         * 正解
         */

        successCount++;

        isLocked = true;


        /*
         * お皿へピューッ
         */

        flyToTray(() => {

          if (successCount === 1) {

            isLocked = false;
            resetDraggablePosition();

            playMp3("success1.mp3");

          }

          else if (successCount === 2) {

            isLocked = false;
            resetDraggablePosition();

            playMp3("success2.mp3");

          }

          else if (successCount >= 3) {

            if (currentStage === 1) {

              /*
               * さくらんぼ3つ目
               */

              playMp3(
                "3ko.mp3",
                () => {
                  startStage(2);
                }
              );

            }

            else {

              /*
               * お団子3つ目
               */

              playMp3(
                "clear2.mp3",
                () => {

                  showRewardScreen();

                  playMp3(
                    "fanfare.mp3",
                    () => {
                      playMp3("retry.mp3");
                    }
                  );
                }
              );
            }
          }

        });


      } else {

        /*
         * 不正解
         */

        draggable.classList.add(
          "snap-back"
        );

        currentX = 0;
        currentY = 0;

        draggable.style.transform =
          "translate3d(0px,0px,0px)";
      }
    }


    /* =========================================================
       18. 初期位置
       ========================================================= */

    function resetDraggablePosition() {

      draggable.classList.remove(
        "snap-back"
      );

      currentX = 0;
      currentY = 0;

      draggable.style.transform =
        "translate3d(0px,0px,0px)";

      hasPinged = false;
    }


    /* =========================================================
       19. イベント
       ========================================================= */

    draggable.addEventListener(
      "touchstart",
      handleDragStart,
      { passive:false }
    );

    window.addEventListener(
      "touchmove",
      handleDragMove,
      { passive:false }
    );

    window.addEventListener(
      "touchend",
      handleDragEnd,
      { passive:false }
    );


    draggable.addEventListener(
      "mousedown",
      handleDragStart
    );

    window.addEventListener(
      "mousemove",
      handleDragMove
    );

    window.addEventListener(
      "mouseup",
      handleDragEnd
    );


    /* =========================================================
       20. くす玉・紙吹雪
       ========================================================= */

    const canvas =
      document.getElementById(
        "confetti-canvas"
      );

    const ctx =
      canvas.getContext("2d");

    let particles = [];
    let animationId = null;


    function showRewardScreen() {

      showScreen(screenReward);

      btnReset.classList.add(
        "pika-pika"
      );

      startConfetti();
    }


    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;
    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    function startConfetti() {

      resizeCanvas();

      particles = [];

      const colors = [
        "#f43f5e",
        "#0ea5e9",
        "#eab308",
        "#22c55e",
        "#a855f7",
        "#ec4899"
      ];

      for (let i = 0; i < 120; i++) {

        particles.push({

          x:
            Math.random() *
            canvas.width,

          y:
            Math.random() *
              canvas.height -
            canvas.height,

          size:
            Math.random() *
              14 +
            6,

          color:
            colors[
              Math.floor(
                Math.random() *
                colors.length
              )
            ],

          vy:
            Math.random() * 3 + 2,

          vx:
            Math.random() * 2 - 1,

          rotation:
            Math.random() * 360,

          rotSpeed:
            Math.random() * 4 - 2
        });
      }

      renderConfetti();
    }


    function renderConfetti() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      particles.forEach(p => {

        p.y += p.vy;
        p.x += p.vx;
        p.rotation += p.rotSpeed;


        if (p.y > canvas.height) {

          p.y = -20;

          p.x =
            Math.random() *
            canvas.width;
        }


        ctx.save();

        ctx.translate(
          p.x,
          p.y
        );

        ctx.rotate(
          p.rotation *
          Math.PI /
          180
        );

        ctx.fillStyle =
          p.color;

        ctx.fillRect(
          -p.size / 2,
          -p.size / 2,
          p.size,
          p.size
        );

        ctx.restore();

      });


      animationId =
        requestAnimationFrame(
          renderConfetti
        );
    }


    function stopConfetti() {

      if (animationId) {

        cancelAnimationFrame(
          animationId
        );

        animationId = null;
      }
    }


    /* =========================================================
       21. スタート
       ========================================================= */

    btnTonton.addEventListener(
      "click",
      () => {

        unlockAudioIOS();

        startStage(1);

        playMp3(
          "start1.mp3"
        );
      }
    );


    screenStart.addEventListener(
      "click",
      e => {

        if (e.target === screenStart) {

          unlockAudioIOS();

          startStage(1);

          playMp3(
            "start1.mp3"
          );
        }
      }
    );


    /* =========================================================
       22. リセット
       ========================================================= */

    btnReset.addEventListener(
      "click",
      () => {

        isLocked = false;

        audioPlayer.pause();

        stopConfetti();

        showScreen(
          screenStart
        );
      }
    );


    /* =========================================================
       23. もう一度
       ========================================================= */

    btnReplay.addEventListener(
      "click",
      () => {

        isLocked = false;

        audioPlayer.pause();

        stopConfetti();

        showScreen(
          screenStart
        );
      }
    );

  </script>

</body>
