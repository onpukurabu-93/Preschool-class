<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ・タブレットの画面固定とズーム・スクロール禁止設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ピアノ知育ミニゲーム</title>
  <style>
    /* =========================================================
       1. 基本スタイル＆全画面リセット (iPad最適化)
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f9ff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
      touch-action: none; /* iPad Safariでの画面バウンス・スクロールを強力に禁止 */
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      box-sizing: border-box;
    }

    /* =========================================================
       2. 進捗表示（★マーク）
       ========================================================= */
    .progress-bar {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      z-index: 10;
    }

    .star {
      width: 50px;
      height: 50px;
      background: #cbd5e1;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .star.active {
      background: #facc15;
      transform: scale(1.25);
    }

    /* =========================================================
       3. 鍵盤表示エリア
          （画像がある場合は画像をクッキリ表示、ない場合はCSSで描画）
       ========================================================= */
    .keyboard-wrapper {
      position: relative;
      width: 88vw;
      max-width: 650px;
      height: 240px;
      margin-top: 10px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* 画像が正しく読み込めた場合、背景画像が隠れないようCSSの土台を透明化 */
    .keyboard-wrapper.has-custom-bg .piano-keyboard {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .keyboard-wrapper.has-custom-bg .white-key {
      opacity: 0 !important; /* 背景画像を見せるため白鍵を透明化 */
    }

    /* 鍵盤の土台（白鍵群） */
    .piano-keyboard {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      background: #1e293b;
      border: 5px solid #0f172a;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      overflow: visible;
      transition: background 0.2s ease;
    }

    /* 白鍵スタイル */
    .white-key {
      flex: 1;
      height: 100%;
      background: linear-gradient(to bottom, #ffffff 0%, #f8fafc 85%, #e2e8f0 100%);
      border: 2px solid #cbd5e1;
      border-top: none;
      border-radius: 0 0 10px 10px;
      box-shadow: inset 0 -5px 10px rgba(0,0,0,0.05);
    }

    /* 黒鍵ターゲットエリア（当たり判定枠 兼 黒鍵ビジュアル） */
    .black-keys-target {
      position: absolute;
      top: 0;
      height: 62%;
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      border-radius: 0 0 12px 12px;
      padding: 0 4px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      z-index: 5;
    }

    /* 画像背景がある場合、黒鍵ターゲットを少し見やすく透過ブレンド */
    .keyboard-wrapper.has-custom-bg .black-keys-target {
      background: rgba(15, 23, 42, 0.85);
    }

    /* ステージ1（ドレミ）：白鍵3枚、中央寄りに黒鍵2本 */
    .stage1-target {
      left: 16.66%;
      width: 66.66%;
    }

    /* ステージ2（ファソラシ）：白鍵4枚、中央寄りに黒鍵3本 */
    .stage2-target {
      left: 12.5%;
      width: 75%;
    }

    /* 個別の黒鍵表示 */
    .black-key {
      width: 28%;
      height: 100%;
      background: linear-gradient(to bottom, #334155 0%, #0f172a 100%);
      border-radius: 0 0 6px 6px;
      border: 1px solid #475569;
      box-shadow: inset 0 -3px 6px rgba(255,255,255,0.1);
    }

    /* 正解エリアをわかりやすく光らせるアニメーションガイド */
    .target-highlight {
      outline: 5px dashed #22c55e;
      outline-offset: 4px;
      animation: pulse-glow 1.5s infinite;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* =========================================================
       4. ドラッグ素材エリア（さくらんぼ・串団子）
       ========================================================= */
    .drag-zone {
      width: 100%;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    /* ドラッグ親要素（位置移動 translate3d を担当） */
    .draggable-item {
      position: relative;
      width: 140px;
      height: 140px;
      touch-action: none; /* iOS Safariのタッチバインディング必須 */
      z-index: 50;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }

    /* 画像用コンテナ（回転アニメーションを担当） */
    .image-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease;
    }

    /* ステージ2でお団子を「真横（水平）」に90度回転させるCSS */
    .rotate-horizontal {
      transform: rotate(90deg);
    }

    .draggable-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none; /* タッチイベントの阻害を防止 */
    }

    /* 画像読み込み失敗時の絵文字フォールバック */
    .emoji-fallback {
      font-size: 85px;
      line-height: 1;
      pointer-events: none;
    }

    /* アニメーション用：不正解時にスッと元の位置へ戻る */
    .snap-back {
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important;
    }

    /* =========================================================
       5. ステージ3：ごほうび画面（画面いっぱいの紙吹雪＆花丸）
       ========================================================= */
    #reward-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.96);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .reward-flower {
      font-size: 160px;
      animation: reward-pop 0.8s infinite alternate ease-in-out;
      z-index: 1001;
    }

    @keyframes reward-pop {
      0% { transform: scale(0.85) rotate(-6deg); }
      100% { transform: scale(1.15) rotate(6deg); }
    }

    .reset-button-icon {
      margin-top: 30px;
      width: 90px;
      height: 90px;
      background: #ff4757;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 45px;
      box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5);
      animation: pulse-icon 1.2s infinite;
      z-index: 1001;
    }

    @keyframes pulse-icon {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.1); }
      100% { transform: scale(0.95); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 進捗（★）マーク -->
    <div class="progress-bar">
      <div class="star" id="star-1"></div>
      <div class="star" id="star-2"></div>
      <div class="star" id="star-3"></div>
    </div>

    <!-- 鍵盤エリア -->
    <div class="keyboard-wrapper" id="keyboard-wrapper">
      <!-- JavaScriptでステージごとの鍵盤HTMLが挿入されます -->
    </div>

    <!-- ドラッグ素材の初期表示エリア -->
    <div class="drag-zone">
      <div id="draggable" class="draggable-item">
        <div id="image-container" class="image-container">
          <!-- 画像要素（多段階エラー判定で確実に読み込み） -->
          <img id="item-img" src="" alt="素材">
          <div id="emoji-fallback" class="emoji-fallback" style="display: none;">🍒</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ステージ3：ごほうび全画面演出 -->
  <div id="reward-screen">
    <canvas id="confetti-canvas"></canvas>
    <div class="reward-flower">💮</div>
    <div class="reset-button-icon">↻</div>
  </div>

  <script>
    /* =========================================================
       調整用パラメーター
       ========================================================= */
    const HIT_MARGIN = 45; // 単位: px

    /* =========================================================
       【強化】ファイル名・拡張子の全バリエーション探査リスト
       大文字小文字・JPG/PNG全対応でどれか1つでも存在すれば自動読み込みします
       ========================================================= */
    const FILES_STAGE1_BG = [
      "kenban1.png", "Kenban1.png", "kenban1.PNG", "Kenban1.PNG", "KENBAN1.PNG",
      "kenban1.jpg", "Kenban1.jpg", "kenban1.JPG", "Kenban1.JPG", "kenban1.jpeg"
    ];
    const FILES_STAGE2_BG = [
      "kenban2.png", "Kenban2.png", "kenban2.PNG", "Kenban2.PNG", "KENBAN2.PNG",
      "kenban2.jpg", "Kenban2.jpg", "kenban2.JPG", "Kenban2.JPG", "kenban2.jpeg"
    ];
    const FILES_SAKURANBO  = [
      "sakuranbo.png", "Sakuranbo.png", "sakuranbo.PNG", "Sakuranbo.PNG", "SAKURANBO.PNG",
      "sakuranbo.jpg", "Sakuranbo.jpg", "sakuranbo.JPG", "Sakuranbo.JPG", "sakuranbo.jpeg"
    ];
    const FILES_KUSHIDANGO = [
      "kushidango.png", "Kushidango.png", "kushidango.PNG", "Kushidango.PNG", "KUSHIDANGO.PNG",
      "kushidango.jpg", "Kushidango.jpg", "kushidango.JPG", "Kushidango.JPG", "kushidango.jpeg"
    ];

    /* =========================================================
       ゲーム状態管理変数
       ========================================================= */
    let currentStage = 1; // 1: さくらんぼ, 2: 串団子, 3: ごほうび
    let successCount = 0; // 正解回数 (0～3)

    // ドラッグ計算用変数
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;

    // DOM要素の参照
    const draggable = document.getElementById('draggable');
    const imageContainer = document.getElementById('image-container');
    const itemImg = document.getElementById('item-img');
    const emojiFallback = document.getElementById('emoji-fallback');
    const keyboardWrapper = document.getElementById('keyboard-wrapper');
    const rewardScreen = document.getElementById('reward-screen');

    /* =========================================================
       【強力画像読み込みロジック】全ファイル名探査処理
       ========================================================= */
    // 1. <img> タグ用：多段階フォールバック処理
    function loadItemImageWithFallback(candidates, fallbackEmoji) {
      let index = 0;

      itemImg.style.display = 'block';
      emojiFallback.style.display = 'none';
      emojiFallback.textContent = fallbackEmoji;

      itemImg.onerror = function() {
        index++;
        if (index < candidates.length) {
          itemImg.src = candidates[index];
        } else {
          // すべての拡張子・大文字小文字候補が全滅した場合のみ絵文字を表示
          itemImg.style.display = 'none';
          emojiFallback.style.display = 'block';
        }
      };

      // 最初の候補から試行開始
      itemImg.src = candidates[0];
    }

    // 2. 背景画像（CSS鍵盤）用：自動探査＆背景表示の最適化
    function setWrapperBackgroundWithFallback(candidates) {
      let index = 0;
      // 一旦背景画像フラグをクリア
      keyboardWrapper.classList.remove('has-custom-bg');

      function tryNextBackground() {
        if (index >= candidates.length) {
          // 画像が一切無かった場合は標準CSS鍵盤を表示
          keyboardWrapper.style.backgroundImage = 'none';
          return;
        }

        const img = new Image();
        const testUrl = candidates[index];

        img.onload = function() {
          // 画像が存在したら背景に指定し、CSSスタイルを最適化
          keyboardWrapper.style.backgroundImage = `url('${testUrl}')`;
          keyboardWrapper.classList.add('has-custom-bg');
        };

        img.onerror = function() {
          index++;
          tryNextBackground();
        };

        img.src = testUrl;
      }

      tryNextBackground();
    }

    /* =========================================================
       Web Audio API & SpeechSynthesis iOS解放コード
       ========================================================= */
    let audioCtx = null;
    let isAudioUnlocked = false;
    let isSpeechUnlocked = false;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
    }

    function unlockMedia() {
      // 1. Web Audio API 解放
      initAudioContext();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (audioCtx && !isAudioUnlocked) {
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
        isAudioUnlocked = true;
      }

      // 2. SpeechSynthesis（自動音声）解放
      if ('speechSynthesis' in window && !isSpeechUnlocked) {
        const dummyUtterance = new SpeechSynthesisUtterance('');
        dummyUtterance.lang = 'ja-JP';
        dummyUtterance.volume = 0; // 無音で初期化
        window.speechSynthesis.speak(dummyUtterance);
        isSpeechUnlocked = true;
      }
    }

    // タッチ・クリック時に自動解凍イベントを登録
    ['touchstart', 'touchend', 'pointerdown', 'mousedown'].forEach(eventName => {
      window.addEventListener(eventName, unlockMedia, { once: true, passive: true });
    });

    // --- 日本語の自動音声案内（SpeechSynthesis） ---
    function speakGuide(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.95; 
      utterance.pitch = 1.25;

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang.includes('ja') || v.lang.includes('JP'));
      if (jaVoice) {
        utterance.voice = jaVoice;
      }

      setTimeout(() => {
        window.speechSynthesis.speak(utterance);
      }, 120);
    }

    function playCurrentGuide() {
      if (currentStage === 1) {
        speakGuide("さくらんぼを黒い鍵盤の上に置いてね");
      } else if (currentStage === 2) {
        speakGuide("お団子を黒い鍵盤の上に置いてね");
      }
    }

    // --- 効果音作成 ---
    function playDingDong() {
      unlockMedia();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // 「ピン」
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(1318.51, now);
      gain1.gain.setValueAtTime(0.35, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.4);

      // 「ポン」
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1046.50, now + 0.15);
      gain2.gain.setValueAtTime(0.35, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.15);
      osc2.stop(now + 0.7);
    }

    function playFanfare() {
      unlockMedia();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        
        const duration = (idx === notes.length - 1) ? 0.7 : 0.12;
        gain.gain.setValueAtTime(0.3, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + duration);
      });
    }

    function playGrandTaDa() {
      unlockMedia();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const chord = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];

      chord.forEach((freq) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 2.2);
      });
    }

    /* =========================================================
       ステージ描画 & 管理処理
       ========================================================= */
    function loadStage(stageNum) {
      currentStage = stageNum;
      successCount = 0;
      updateStars();

      // 初期ドラッグ位置にリセット
      resetDraggablePosition();

      if (stageNum === 1) {
        // --- ステージ1：ドレミ（黒鍵2本・さくらんぼ） ---
        setWrapperBackgroundWithFallback(FILES_STAGE1_BG);
        loadItemImageWithFallback(FILES_SAKURANBO, "🍒");
        
        // さくらんぼは元の向きで表示
        imageContainer.classList.remove('rotate-horizontal');

        // 白鍵3枚、黒鍵2本の鍵盤枠を生成
        keyboardWrapper.innerHTML = `
          <div class="piano-keyboard">
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="black-keys-target stage1-target target-highlight" id="target-area">
              <div class="black-key"></div>
              <div class="black-key"></div>
            </div>
          </div>
        `;

        // 音声ガイド再生
        playCurrentGuide();

      } else if (stageNum === 2) {
        // --- ステージ2：ファソラシ（黒鍵3本・串団子） ---
        setWrapperBackgroundWithFallback(FILES_STAGE2_BG);
        loadItemImageWithFallback(FILES_KUSHIDANGO, "🍡");

        // お団子画像をCSSで「真横（水平）」に90度回転
        imageContainer.classList.add('rotate-horizontal');

        // 白鍵4枚、黒鍵3本の鍵盤枠を生成
        keyboardWrapper.innerHTML = `
          <div class="piano-keyboard">
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="white-key"></div>
            <div class="black-keys-target stage2-target target-highlight" id="target-area">
              <div class="black-key"></div>
              <div class="black-key"></div>
              <div class="black-key"></div>
            </div>
          </div>
        `;

        // 音声ガイド再生
        playCurrentGuide();

      } else if (stageNum === 3) {
        // --- ステージ3：ごほうび画面 ---
        showRewardScreen();
        return;
      }
    }

    // ★進捗表示の更新
    function updateStars() {
      for (let i = 1; i <= 3; i++) {
        const star = document.getElementById(`star-${i}`);
        if (i <= successCount) {
          star.classList.add('active');
        } else {
          star.classList.remove('active');
        }
      }
    }

    // ドラッグ位置のリセット
    function resetDraggablePosition() {
      draggable.classList.remove('snap-back');
      currentX = 0;
      currentY = 0;
      draggable.style.transform = 'translate3d(0px, 0px, 0px)';
    }

    /* =========================================================
       iPad完全対応のタッチ＆ドラッグ処理
       ========================================================= */
    function getEventPos(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function handleDragStart(e) {
      unlockMedia();

      if (isDragging) return;
      isDragging = true;

      draggable.classList.remove('snap-back');

      const pos = getEventPos(e);
      startX = pos.x - currentX;
      startY = pos.y - currentY;

      if (e.cancelable) e.preventDefault();
    }

    function handleDragMove(e) {
      if (!isDragging) return;

      if (e.cancelable) e.preventDefault();

      const pos = getEventPos(e);
      currentX = pos.x - startX;
      currentY = pos.y - startY;

      draggable.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px)`;
    }

    function handleDragEnd(e) {
      if (!isDragging) return;
      isDragging = false;

      const targetArea = document.getElementById('target-area');
      if (!targetArea) return;

      const itemRect = draggable.getBoundingClientRect();
      const targetRect = targetArea.getBoundingClientRect();

      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;

      // 当たり判定
      const isHit = 
        itemCenterX >= (targetRect.left - HIT_MARGIN) &&
        itemCenterX <= (targetRect.right + HIT_MARGIN) &&
        itemCenterY >= (targetRect.top - HIT_MARGIN) &&
        itemCenterY <= (targetRect.bottom + HIT_MARGIN);

      if (isHit) {
        // 正解処理
        playDingDong();
        successCount++;
        updateStars();

        resetDraggablePosition();

        if (successCount >= 3) {
          setTimeout(() => {
            playFanfare();
            setTimeout(() => {
              loadStage(currentStage + 1);
            }, 900);
          }, 300);
        } else {
          setTimeout(() => {
            playCurrentGuide();
          }, 600);
        }
      } else {
        // 不正解処理
        draggable.classList.add('snap-back');
        currentX = 0;
        currentY = 0;
        draggable.style.transform = 'translate3d(0px, 0px, 0px)';
      }
    }

    // イベントリスナー登録
    draggable.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd, { passive: false });

    draggable.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);

    /* =========================================================
       ステージ3：ごほうび画面 & 紙吹雪アニメーション
       ========================================================= */
    function showRewardScreen() {
      rewardScreen.style.display = 'flex';
      playGrandTaDa();
      startConfetti();
    }

    rewardScreen.addEventListener('click', () => {
      rewardScreen.style.display = 'none';
      stopConfetti();
      loadStage(1);
    });

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function startConfetti() {
      resizeCanvas();
      particles = [];
      const colors = ['#f43f5e', '#0ea5e9', '#eab308', '#22c55e', '#a855f7', '#ec4899'];

      for (let i = 0; i < 110; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 14 + 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          vy: Math.random() * 3 + 2.5,
          vx: Math.random() * 2 - 1,
          rotation: Math.random() * 360,
          rotSpeed: Math.random() * 4 - 2
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p) => {
        p.y += p.vy;
        p.x += p.vx;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      animationId = requestAnimationFrame(renderConfetti);
    }

    function stopConfetti() {
      if (animationId) {
        cancelAnimationFrame(animationId);
      }
    }

    /* =========================================================
       初期化処理
       ========================================================= */
    function initGame() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
      loadStage(1);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
